<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0e14" />
<title>AirLoom — KSFO</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: rgba(12, 18, 28, 0.92);
    --border: rgba(80, 140, 200, 0.25);
    --text: #d6e4f0;
    --muted: #7a8fa3;
    --accent: #3ecf8e;
    --cyan: #4ecdc4;
    --warn: #f0b429;
    --danger: #ff6b6b;
    --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }
  #c { display: block; width: 100%; height: 100%; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #hud {
    position: absolute; top: 14px; left: 18px; z-index: 5; pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.85);
  }
  #hud h1 {
    font-size: 15px; letter-spacing: 0.28em; font-weight: 600; color: #e8f4ff;
  }
  #hud .sub { margin-top: 4px; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; font-family: var(--mono); }
  #hud .note { margin-top: 2px; font-size: 11px; color: var(--warn); }
  #stats {
    position: absolute; top: 14px; right: 18px; z-index: 5; text-align: right;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    text-shadow: 0 1px 8px rgba(0,0,0,0.85); pointer-events: none;
  }
  #stats .n { color: var(--cyan); font-size: 18px; font-weight: 600; }
  #stats .arr { color: var(--accent); font-size: 14px; font-weight: 600; }
  #drawer {
    position: absolute; top: 0; left: 0; bottom: 0; width: 292px; z-index: 10;
    background: var(--panel); border-right: 1px solid var(--border);
    backdrop-filter: blur(12px); transform: translateX(0);
    transition: transform 0.25s ease; display: flex; flex-direction: column;
    font-size: 12px;
  }
  #drawer.collapsed { transform: translateX(-100%); }
  #drawer header {
    padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
    letter-spacing: 0.2em; font-size: 11px; color: var(--cyan);
  }
  #drawer .body { padding: 12px 16px 24px; overflow-y: auto; flex: 1; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; gap: 8px; }
  .row label { color: var(--muted); flex: 1; }
  .row .val { font-family: var(--mono); color: var(--text); min-width: 42px; text-align: right; }
  .section { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  .section h3 { font-size: 10px; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; }
  input[type="range"] { width: 100%; accent-color: var(--cyan); }
  input[type="text"], input[type="search"] {
    width: 100%; background: rgba(0,0,0,0.35); border: 1px solid var(--border);
    color: var(--text); padding: 7px 9px; border-radius: 4px; font-family: var(--mono); font-size: 12px;
  }
  input[type="checkbox"] { accent-color: var(--cyan); }
  button {
    background: rgba(62, 207, 142, 0.12); border: 1px solid rgba(62, 207, 142, 0.4);
    color: var(--accent); padding: 7px 10px; border-radius: 4px; cursor: pointer;
    font-size: 11px; letter-spacing: 0.06em; width: 100%;
  }
  button:hover { background: rgba(62, 207, 142, 0.22); }
  button.ghost { background: transparent; border-color: var(--border); color: var(--muted); }
  button.mode-btn { margin-top: 4px; }
  button.mode-btn.active {
    background: rgba(62, 207, 142, 0.28); border-color: var(--accent); color: #fff;
  }
  #toggleDrawer {
    position: absolute; top: 12px; left: 300px; z-index: 11;
    width: auto; padding: 6px 10px; transition: left 0.25s ease;
  }
  #drawer.collapsed + #toggleDrawer { left: 12px; }
  #sel {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 18px; min-width: 280px; max-width: 90vw; z-index: 8;
    display: none; backdrop-filter: blur(10px); font-family: var(--mono); font-size: 12px;
  }
  #sel.visible { display: block; }
  #sel .cs { font-size: 16px; color: #fff; letter-spacing: 0.12em; margin-bottom: 6px; }
  #sel .grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; color: var(--muted); }
  #sel .grid b { color: var(--text); font-weight: 500; }
  #toast {
    position: absolute; bottom: 18px; right: 18px; z-index: 9;
    background: rgba(20,10,10,0.9); border: 1px solid rgba(255,107,107,0.4);
    color: #ffb4b4; padding: 8px 12px; border-radius: 6px; font-size: 11px;
    display: none; max-width: 320px;
  }
  a.credits {
    position: absolute; bottom: 10px; left: 18px; z-index: 5;
    font-size: 10px; color: var(--muted); text-decoration: none; opacity: 0.7;
  }
  a.credits:hover { opacity: 1; color: var(--cyan); }
  #arrivalsList {
    max-height: 280px; overflow-y: auto; margin-top: 6px;
    font-family: var(--mono); font-size: 10px;
  }
  .arr-row {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
    padding: 6px 4px; border-bottom: 1px solid rgba(80,140,200,0.12);
    cursor: pointer; border-radius: 3px;
  }
  .arr-row:hover, .arr-row.selected { background: rgba(62,207,142,0.12); }
  .arr-row .cs { color: #e8f4ff; font-weight: 600; letter-spacing: 0.06em; }
  .arr-row .meta { color: var(--muted); }
  .arr-row .nums { text-align: right; color: var(--cyan); white-space: nowrap; }
  .arr-empty { color: var(--muted); padding: 8px 0; font-size: 11px; }

  #c { touch-action: none; -webkit-tap-highlight-color: transparent; }

  #acLabels {
    position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden;
  }
  .ac-label {
    position: absolute; left: 0; top: 0;
    transform: translate(-50%, calc(-100% - 10px));
    background: rgba(8, 14, 22, 0.78);
    border: 1px solid rgba(120, 180, 230, 0.4);
    border-radius: 4px;
    padding: 2px 6px 3px;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.2;
    color: #e8f4ff;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.75);
    will-change: transform, opacity;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .ac-label .cs { font-weight: 600; letter-spacing: 0.04em; font-size: 11px; }
  .ac-label .meta { color: #9bb4c8; font-size: 9px; margin-top: 1px; }
  .ac-label.dim { opacity: 0.35; }
  .ac-label.hidden { display: none; }
  #toast.visible { display: block; }
  @media (max-width: 720px) {
    #drawer { width: min(86vw, 320px); }
    #drawer.collapsed { transform: translateX(-100%); }
    #toggleDrawer { left: 12px; top: max(12px, env(safe-area-inset-top)); }
    #drawer:not(.collapsed) + #toggleDrawer { left: calc(min(86vw, 320px) + 8px); }
    #hud { top: max(14px, env(safe-area-inset-top)); left: 14px; }
    #stats { top: max(14px, env(safe-area-inset-top)); right: 14px; }
    #sel { bottom: max(18px, env(safe-area-inset-bottom)); }
    a.credits { bottom: max(10px, env(safe-area-inset-bottom)); }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
<canvas id="c"></canvas>
<div id="acLabels" aria-hidden="true"></div>

<div id="hud">
  <h1>AIR LOOM — <span id="hudAirport">KSFO</span></h1>
  <div class="sub" id="hudSub">San Francisco Intl · live ADS-B via Skyway</div>
  <div class="note" id="hudNote" style="display:none"></div>
</div>
<div id="stats">
  <div><span class="arr" id="arrCount">—</span> arrivals</div>
  <div><span class="n" id="acCount">—</span> shown</div>
  <div id="srcLine">source: —</div>
  <div id="pollLine">poll: —</div>
</div>

<aside id="drawer">
  <header>AIR LOOM CONTROLS</header>
  <div class="body">
    <div class="row"><label>Shown</label><span class="val" id="uiCount">0</span></div>
    <div class="row"><label>Arrivals</label><span class="val" id="uiArrCount" style="color:var(--accent)">0</span></div>
    <div class="row"><label>Recording</label><span class="val" style="color:var(--muted)">inactive</span></div>
    <div class="row"><label>Memory</label><span class="val" id="uiMem" style="color:var(--muted)">—</span></div>

    <div class="section">
      <h3>Traffic mode</h3>
      <button type="button" class="mode-btn active" id="btnArrivals">Arrivals focus</button>
      <button type="button" class="mode-btn ghost" id="btnAllTraffic" style="margin-top:6px">Show all traffic</button>
      <div class="row" style="margin-top:8px"><label>Mode</label><span class="val" id="uiMode">arrivals</span></div>
    </div>

    <div class="section">
      <h3>Live arrivals</h3>
      <div id="arrivalsList"><div class="arr-empty">Waiting for ADS-B…</div></div>
    </div>

    <div class="section">
      <h3>Data sources</h3>
      <div class="row"><label>Flight Data</label><span class="val" id="uiSource" style="font-size:10px">—</span></div>
      <div class="row"><label>Airport</label><span class="val">KSFO</span></div>
    </div>

    <div class="section">
      <h3>View</h3>
      <div class="row"><label>Radius (nm)</label><span class="val" id="vRadius">50</span></div>
      <input type="range" id="sRadius" min="15" max="120" value="50" step="5" />
      <div class="row"><label>Trail length</label><span class="val" id="vTrail">40</span></div>
      <input type="range" id="sTrail" min="5" max="120" value="40" step="5" />
      <div class="row"><label>Altitude scale</label><span class="val" id="vAltScale">1.2</span></div>
      <input type="range" id="sAltScale" min="0.4" max="3" value="1.2" step="0.1" />
      <div class="row">
        <label for="sGround">Show on ground</label>
        <input type="checkbox" id="sGround" />
      </div>
      <div class="row">
        <label for="sAuto">Auto-rotate</label>
        <input type="checkbox" id="sAuto" checked />
      </div>
      <div class="row">
        <label for="sVelVec">Velocity vectors</label>
        <input type="checkbox" id="sVelVec" checked />
      </div>
    </div>

    <div class="section">
      <h3>Filter</h3>
      <input type="search" id="sFilter" placeholder="callsign / hex…" autocomplete="off" />
      <div style="height:8px"></div>
      <button type="button" class="ghost" id="btnClear">Clear filters</button>
    </div>

    <div class="section">
      <h3>Selected</h3>
      <div id="uiSelNone" style="color:var(--muted)">Click an aircraft</div>
      <div id="uiSelBody" style="display:none;font-family:var(--mono);line-height:1.55"></div>
    </div>
  </div>
</aside>
<button type="button" id="toggleDrawer" title="Toggle panel">☰</button>

<div id="sel">
  <div class="cs" id="selCs">—</div>
  <div class="grid" id="selGrid"></div>
</div>
<div id="toast"></div>
<a class="credits" href="https://objectiveunclear.com/airloom" target="_blank" rel="noopener">inspired by Air Loom</a>

<script type="module">
import * as THREE from '/vendor/three/three.module.js';
import { OrbitControls } from '/vendor/three/addons/controls/OrbitControls.js';

// ─── Airport / ENU ───────────────────────────────────────────────────────────
const AIRPORTS = {
  KSFO: { icao: 'KSFO', name: 'San Francisco Intl', lat: 37.62818, lon: -122.38487 },
  SFO:  { icao: 'KSFO', name: 'San Francisco Intl', lat: 37.62818, lon: -122.38487 },
};

const params = new URLSearchParams(location.search);
let aptCode = (params.get('airport') || 'KSFO').toUpperCase().replace(/^K/, (m, i, s) => s.length === 4 ? 'K' : m);
if (aptCode === 'SFO') aptCode = 'KSFO';
if (aptCode.length === 3) aptCode = 'K' + aptCode;
const known = AIRPORTS[aptCode] || AIRPORTS[(params.get('airport') || '').toUpperCase()];
const ORIGIN = known || AIRPORTS.KSFO;
const UNKNOWN_APT = !known && params.get('airport');

document.getElementById('hudAirport').textContent = ORIGIN.icao;
document.getElementById('hudSub').textContent = ORIGIN.name + ' · live ADS-B via Skyway';
if (UNKNOWN_APT) {
  const n = document.getElementById('hudNote');
  n.style.display = 'block';
  n.textContent = 'Unknown airport "' + params.get('airport') + '" — showing KSFO';
}

const R_EARTH = 6378137;
const NM_M = 1852;
const FT_M = 0.3048;
const KT_MS = 0.514444;
const MAX_AIRCRAFT = 400;
const POLL_MS = 12000;
const ARRIVAL_NM = 50;
const SIZE_MULT = 4.5; // visibility multiplier (was 7.0 — too cartoon-huge; type-relative sizing kept)
const BUILD_MARK = 'trail-mesh-v2'; // served-code marker for deploy verify
window.__AIRLOOM_BUILD = BUILD_MARK;
window.__AIRLOOM_SIZE_MULT = SIZE_MULT;

function enu(lat, lon, altM) {
  const dLat = (lat - ORIGIN.lat) * Math.PI / 180;
  const dLon = (lon - ORIGIN.lon) * Math.PI / 180;
  const cos = Math.cos(ORIGIN.lat * Math.PI / 180);
  const east = dLon * cos * R_EARTH;
  const north = dLat * R_EARTH;
  return { x: east, y: altM || 0, z: -north };
}

function haversineNm(lat1, lon1, lat2, lon2) {
  const toR = Math.PI / 180;
  const a = Math.sin((lat2 - lat1) * toR / 2) ** 2 +
    Math.cos(lat1 * toR) * Math.cos(lat2 * toR) * Math.sin((lon2 - lon1) * toR / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.sqrt(a)) / NM_M;
}

/** Bearing from (lat1,lon1) to (lat2,lon2), degrees 0–360 true. */
function bearingDeg(lat1, lon1, lat2, lon2) {
  const toR = Math.PI / 180;
  const φ1 = lat1 * toR, φ2 = lat2 * toR;
  const Δλ = (lon2 - lon1) * toR;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
}

function angDiff(a, b) {
  let d = ((a - b + 540) % 360) - 180;
  return d;
}

function altColor(altM) {
  // Full vivid rainbow by altitude (0–12000 m):
  // low red → orange → yellow → green → cyan → blue → violet (high)
  const t = Math.max(0, Math.min(1, (altM || 0) / 12000));
  const hue = t * 0.78; // 0 → ~280° (stop before wrapping to red)
  const c = new THREE.Color();
  c.setHSL(hue, 1.0, 0.52);
  return c;
}

// ─── ICAO type → category / size ─────────────────────────────────────────────
const TYPE_CAT = {
  // Heavy / widebody
  B744: 'heavy', B748: 'heavy', B772: 'heavy', B77W: 'heavy', B77L: 'heavy',
  B788: 'heavy', B789: 'heavy', B78X: 'heavy', B763: 'heavy', B764: 'heavy',
  A332: 'heavy', A333: 'heavy', A339: 'heavy', A342: 'heavy', A343: 'heavy',
  A359: 'heavy', A35K: 'heavy', A388: 'super', A124: 'super',
  MD11: 'heavy', DC10: 'heavy', B742: 'heavy', B743: 'heavy',
  // Medium narrowbody
  B712: 'medium', B717: 'medium', B721: 'medium', B722: 'medium',
  B732: 'medium', B733: 'medium', B734: 'medium', B735: 'medium',
  B736: 'medium', B737: 'medium', B738: 'medium', B739: 'medium',
  B37M: 'medium', B38M: 'medium', B39M: 'medium',
  B752: 'medium', B753: 'medium',
  A318: 'medium', A319: 'medium', A320: 'medium', A321: 'medium',
  A20N: 'medium', A21N: 'medium', A19N: 'medium',
  MD80: 'medium', MD82: 'medium', MD83: 'medium', MD88: 'medium', MD90: 'medium',
  BCS1: 'medium', BCS3: 'medium', CSERIES: 'medium',
  // Regional
  E170: 'regional', E75L: 'regional', E75S: 'regional', E190: 'regional', E195: 'regional',
  E290: 'regional', E295: 'regional',
  CRJ1: 'regional', CRJ2: 'regional', CRJ7: 'regional', CRJ9: 'regional', CRJX: 'regional',
  DH8A: 'regional', DH8B: 'regional', DH8C: 'regional', DH8D: 'regional',
  AT72: 'regional', AT75: 'regional', AT76: 'regional', AT45: 'regional', AT46: 'regional',
  SF34: 'regional', SB20: 'regional', RJ85: 'regional', RJ1H: 'regional',
  // Light GA
  C152: 'light', C172: 'light', C182: 'light', C206: 'light', C208: 'light',
  C210: 'light', C310: 'light', C337: 'light', C402: 'light', C414: 'light',
  C421: 'light', C441: 'light', C525: 'light', C550: 'light', C56X: 'light',
  C680: 'light', C750: 'light', BE20: 'light', BE36: 'light', BE58: 'light',
  BE9L: 'light', PA28: 'light', P28A: 'light', P28R: 'light', PA32: 'light',
  PA34: 'light', PA44: 'light', PA46: 'light', SR20: 'light', SR22: 'light',
  DA40: 'light', DA42: 'light', M20P: 'light', TBM7: 'light', TBM8: 'light',
  TBM9: 'light', PC12: 'light', BE40: 'light', CL30: 'light', CL35: 'light',
  CL60: 'light', GLF4: 'light', GLF5: 'light', GLF6: 'light', GLEX: 'light',
  FA50: 'light', FA7X: 'light', GALX: 'light', LJ45: 'light', LJ60: 'light',
  H25B: 'light', HA4T: 'light',
  // Heli
  B06: 'heli', B407: 'heli', B412: 'heli', B429: 'heli', B505: 'heli',
  EC35: 'heli', EC45: 'heli', EC55: 'heli', A109: 'heli', A139: 'heli',
  R44: 'heli', R66: 'heli', S76: 'heli', UH1: 'heli',
};

const CAT_SIZE = {
  super:    { span: 79.8, len: 73.0, engines: 4, ttail: false },
  heavy:    { span: 60.9, len: 63.7, engines: 2, ttail: false },
  medium:   { span: 35.8, len: 39.5, engines: 2, ttail: false },
  regional: { span: 28.7, len: 31.7, engines: 2, ttail: true  },
  light:    { span: 11.0, len: 8.3,  engines: 1, ttail: false },
  heli:     { span: 12.0, len: 12.0, engines: 0, ttail: false },
  unknown:  { span: 30.0, len: 33.0, engines: 2, ttail: false },
};

function classifyType(icaoType) {
  if (!icaoType) return 'unknown';
  const t = String(icaoType).toUpperCase().trim();
  if (TYPE_CAT[t]) return TYPE_CAT[t];
  // prefix heuristics
  if (/^A3[5-8]|^B74|^B77|^B78|^A38|^MD11/.test(t)) return 'heavy';
  if (/^B7[3-5]|^A31|^A32|^BCS|^MD8|^MD9/.test(t)) return 'medium';
  if (/^E1|^E2|^CRJ|^DH8|^AT[457]|^SF3|^RJ/.test(t)) return 'regional';
  if (/^C[1-7]|^PA|^BE|^SR|^DA|^PC|^TBM|^GLF|^LJ|^CL|^FA|^H25/.test(t)) return 'light';
  if (/^EC|^R4|^R6|^UH|^B4|^A1[0-4]|^S76/.test(t)) return 'heli';
  return 'unknown';
}

function sizeForType(icaoType) {
  const cat = classifyType(icaoType);
  return { cat, ...(CAT_SIZE[cat] || CAT_SIZE.unknown) };
}

// ─── 3D aircraft models (nose along +Z) ──────────────────────────────────────
const modelCache = new Map(); // cat → Group template (cloneable)

/** Trapezoidal wing half (root→tip), extruded, then mirrored. */
function makeSweptWing(span, chordRoot, chordTip, thick, sweepDeg) {
  const half = span * 0.5;
  const sweep = Math.tan(sweepDeg * Math.PI / 180) * half;
  const shape = new THREE.Shape();
  // Shape XY → after extrude+rotateX(-π/2): x=span, z=-y (so −y_shape = +Z nose).
  // Sweep shifts tip toward +y_shape (= aft / −Z).
  shape.moveTo(0, -chordRoot * 0.30);              // LE root (forward)
  shape.lineTo(half, -chordTip * 0.22 + sweep);    // LE tip (swept aft)
  shape.lineTo(half,  chordTip * 0.78 + sweep);    // TE tip
  shape.lineTo(0,  chordRoot * 0.70);              // TE root
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: thick, bevelEnabled: false, curveSegments: 1, steps: 1,
  });
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, -thick * 0.5, 0);
  return geo;
}

function buildAircraftModel(cat) {
  if (modelCache.has(cat)) return cloneAircraftModel(modelCache.get(cat));

  const sz = CAT_SIZE[cat] || CAT_SIZE.unknown;
  const L = sz.len;   // meters (scaled by SIZE_MULT later)
  const W = sz.span;
  const fuseR = Math.max(0.45, L * 0.032);
  const group = new THREE.Group();
  group.name = 'acModel_' + cat;

  // Slightly less flat plastic: lower emissive, mild metalness
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x6ec8c0, emissive: 0x1a3a38, emissiveIntensity: 0.28,
    roughness: 0.38, metalness: 0.42,
  });
  const wingMat = new THREE.MeshStandardMaterial({
    color: 0x5bb8b0, emissive: 0x143230, emissiveIntensity: 0.22,
    roughness: 0.45, metalness: 0.35, side: THREE.DoubleSide,
  });
  const finMat = new THREE.MeshStandardMaterial({
    color: 0x4ecdc4, emissive: 0x4ecdc4, emissiveIntensity: 0.55,
    roughness: 0.35, metalness: 0.3,
  });
  const engMat = new THREE.MeshStandardMaterial({
    color: 0x7a8a9a, emissive: 0x121820, emissiveIntensity: 0.12,
    roughness: 0.4, metalness: 0.55,
  });

  if (cat === 'heli') {
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(fuseR * 2.0, fuseR * 2.2, L * 0.38), bodyMat);
    cabin.position.z = L * 0.06;
    cabin.userData.part = 'body';
    group.add(cabin);
    const boom = new THREE.Mesh(new THREE.CylinderGeometry(fuseR * 0.32, fuseR * 0.22, L * 0.52, 8), bodyMat);
    boom.rotation.x = Math.PI / 2;
    boom.position.z = -L * 0.28;
    boom.userData.part = 'body';
    group.add(boom);
    const rotor = new THREE.Mesh(
      new THREE.CylinderGeometry(W * 0.48, W * 0.48, 0.12, 28),
      new THREE.MeshStandardMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.32, roughness: 0.55, metalness: 0.2 })
    );
    rotor.position.y = fuseR * 1.55;
    rotor.userData.part = 'rotor';
    group.add(rotor);
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.12, fuseR * 1.6, fuseR * 1.1), finMat);
    fin.position.set(0, fuseR * 0.55, -L * 0.46);
    fin.userData.part = 'fin';
    group.add(fin);
  } else {
    // Fuselage: main tube + tapered nose/tail for airliner silhouette
    const fuseLen = L * 0.78;
    const fuse = new THREE.Mesh(
      new THREE.CylinderGeometry(fuseR * 0.98, fuseR, fuseLen, 12),
      bodyMat
    );
    fuse.rotation.x = Math.PI / 2;
    fuse.userData.part = 'body';
    group.add(fuse);

    const nose = new THREE.Mesh(new THREE.ConeGeometry(fuseR * 0.98, L * 0.14, 10), bodyMat);
    nose.rotation.x = Math.PI / 2;
    nose.position.z = fuseLen / 2 + L * 0.055;
    nose.userData.part = 'body';
    group.add(nose);

    // Cockpit bulge hint
    const cockpit = new THREE.Mesh(
      new THREE.SphereGeometry(fuseR * 0.85, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.55),
      bodyMat
    );
    cockpit.position.set(0, fuseR * 0.35, fuseLen / 2 * 0.72);
    cockpit.scale.set(1, 0.7, 1.1);
    cockpit.userData.part = 'body';
    group.add(cockpit);

    const tailCone = new THREE.Mesh(new THREE.ConeGeometry(fuseR * 0.5, L * 0.16, 10), bodyMat);
    tailCone.rotation.x = -Math.PI / 2;
    tailCone.position.z = -fuseLen / 2 - L * 0.05;
    tailCone.userData.part = 'body';
    group.add(tailCone);

    // Wings — swept, tapered, slight anhedral/dihedral by category
    const wingThick = Math.max(0.22, fuseR * 0.32);
    const chordRoot = L * (cat === 'super' || cat === 'heavy' ? 0.20 : 0.22);
    const chordTip = chordRoot * 0.38;
    const sweep = (cat === 'super' || cat === 'heavy') ? 28 : (cat === 'medium' ? 24 : (cat === 'light' ? 8 : 18));
    const wingGeo = makeSweptWing(W, chordRoot, chordTip, wingThick, sweep);
    const wingY = -fuseR * (cat === 'light' ? 0.05 : 0.35); // low-wing jets, near-mid GA
    const wingZ = L * (cat === 'light' ? 0.0 : 0.04);

    const wingR = new THREE.Mesh(wingGeo, wingMat);
    wingR.position.set(0, wingY, wingZ);
    wingR.userData.part = 'wing';
    group.add(wingR);
    const wingL = new THREE.Mesh(wingGeo.clone(), wingMat);
    wingL.scale.x = -1;
    wingL.position.set(0, wingY, wingZ);
    wingL.userData.part = 'wing';
    group.add(wingL);

    // Vertical fin — slight sweep via parallelogram box approx
    const finH = Math.max(2.0, L * 0.18);
    const finChord = chordRoot * 0.55;
    const fin = new THREE.Mesh(
      new THREE.BoxGeometry(wingThick * 0.85, finH, finChord),
      finMat
    );
    fin.position.z = -L * 0.38;
    fin.position.y = fuseR * 0.15 + finH * 0.48;
    fin.rotation.x = -0.12; // mild sweep lean
    fin.userData.part = 'fin';
    group.add(fin);

    // Horizontal stabilizer — T-tail for regional, conventional otherwise
    const hStabSpan = W * (sz.ttail ? 0.36 : 0.30);
    const hStabChord = chordRoot * 0.40;
    const hStab = new THREE.Mesh(
      new THREE.BoxGeometry(hStabSpan, wingThick * 0.65, hStabChord),
      wingMat
    );
    if (sz.ttail) {
      hStab.position.set(0, fuseR * 0.15 + finH * 0.92, -L * 0.40);
    } else {
      hStab.position.set(0, fuseR * 0.05, -L * 0.42);
    }
    hStab.userData.part = 'wing';
    group.add(hStab);

    // Engines
    const nEng = sz.engines || 0;
    if (nEng >= 2) {
      const engR = fuseR * (cat === 'super' || cat === 'heavy' ? 0.85 : 0.72);
      const engLen = L * 0.15;
      const yOff = wingY - engR * 0.95;
      const zOff = wingZ + chordRoot * 0.05;
      let xOffs;
      if (nEng === 4) {
        xOffs = [-W * 0.30, -W * 0.16, W * 0.16, W * 0.30];
      } else if (cat === 'heavy' || cat === 'super') {
        xOffs = [-W * 0.24, W * 0.24];
      } else if (cat === 'regional' && sz.ttail) {
        // rear-fuselage mounts common on CRJ / older RJ
        xOffs = [-fuseR * 1.35, fuseR * 1.35];
      } else {
        xOffs = [-W * 0.22, W * 0.22];
      }
      const rearMount = cat === 'regional' && sz.ttail;
      for (const x of xOffs) {
        const eng = new THREE.Mesh(
          new THREE.CylinderGeometry(engR, engR * 0.82, engLen, 10),
          engMat
        );
        eng.rotation.x = Math.PI / 2;
        if (rearMount) {
          eng.position.set(x, fuseR * 0.15, -L * 0.28);
        } else {
          eng.position.set(x, yOff, zOff);
        }
        eng.userData.part = 'engine';
        group.add(eng);
        // intake lip
        const lip = new THREE.Mesh(
          new THREE.TorusGeometry(engR * 0.92, engR * 0.08, 6, 12),
          engMat
        );
        lip.position.copy(eng.position);
        lip.position.z += engLen * 0.48;
        lip.userData.part = 'engine';
        group.add(lip);
      }
    } else if (nEng === 1 && cat === 'light') {
      const spinner = new THREE.Mesh(new THREE.SphereGeometry(fuseR * 0.5, 8, 6), engMat);
      spinner.position.z = fuseLen / 2 + L * 0.12;
      spinner.userData.part = 'engine';
      group.add(spinner);
      // simple prop disc
      const prop = new THREE.Mesh(
        new THREE.CylinderGeometry(fuseR * 2.2, fuseR * 2.2, 0.06, 16),
        new THREE.MeshStandardMaterial({ color: 0xcccccc, transparent: true, opacity: 0.25, roughness: 0.5 })
      );
      prop.rotation.x = Math.PI / 2;
      prop.position.z = fuseLen / 2 + L * 0.13;
      prop.userData.part = 'rotor';
      group.add(prop);
    }
  }

  group.userData.bodyMats = [];
  group.userData.finMats = [];
  group.traverse((ch) => {
    if (!ch.isMesh) return;
    if (Array.isArray(ch.material)) {
      ch.material = ch.material.map((m) => m.clone());
    } else {
      ch.material = ch.material.clone();
    }
    const part = ch.userData.part;
    if (part === 'fin') group.userData.finMats.push(ch.material);
    else if (part === 'body' || part === 'wing') group.userData.bodyMats.push(ch.material);
  });

  modelCache.set(cat, group);
  return cloneAircraftModel(group);
}

function cloneAircraftModel(template) {
  const g = template.clone(true);
  g.traverse((ch) => {
    if (!ch.isMesh || !ch.material) return;
    if (Array.isArray(ch.material)) ch.material = ch.material.map((m) => m.clone());
    else ch.material = ch.material.clone();
  });
  return g;
}

function tintModel(model, color) {
  const bodyMats = [];
  const finMats = [];
  model.traverse((ch) => {
    if (!ch.isMesh || !ch.material) return;
    const mats = Array.isArray(ch.material) ? ch.material : [ch.material];
    const part = ch.userData.part;
    for (const m of mats) {
      if (part === 'engine' || part === 'rotor') continue;
      if (part === 'fin') finMats.push(m);
      else bodyMats.push(m);
    }
  });
  for (const m of bodyMats) {
    if (m.color) m.color.copy(color);
    if (m.emissive) {
      m.emissive.copy(color);
      m.emissive.multiplyScalar(0.35);
    }
    if ('emissiveIntensity' in m) m.emissiveIntensity = 0.32;
  }
  for (const m of finMats) {
    if (m.color) m.color.copy(color);
    if (m.emissive) m.emissive.copy(color);
    if ('emissiveIntensity' in m) m.emissiveIntensity = 0.75;
  }
}

function makeRunwaySketch() {
  const g = new THREE.Group();
  const runways = [
    { hdg: 100, len: 3600, wid: 60, ox: 200, oz: -400 },
    { hdg: 100, len: 3600, wid: 60, ox: -200, oz: 200 },
    { hdg: 10,  len: 2800, wid: 50, ox: -800, oz: 0 },
  ];
  const mat = new THREE.MeshBasicMaterial({ color: 0x2a3340, transparent: true, opacity: 0.85 });
  const edge = new THREE.MeshBasicMaterial({ color: 0xc8d6e0, transparent: true, opacity: 0.5 });
  for (const rw of runways) {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(rw.len, rw.wid), mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.rotation.z = -rw.hdg * Math.PI / 180;
    mesh.position.set(rw.ox, 2, rw.oz);
    g.add(mesh);
    const c = new THREE.Mesh(new THREE.PlaneGeometry(rw.len * 0.9, 2), edge);
    c.rotation.x = -Math.PI / 2;
    c.rotation.z = -rw.hdg * Math.PI / 180;
    c.position.set(rw.ox, 3, rw.oz);
    g.add(c);
  }
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(2200, 2300, 64),
    new THREE.MeshBasicMaterial({ color: 0x3ecf8e, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 1;
  g.add(ring);
  // 40 nm arrivals ring
  const arrRing = new THREE.Mesh(
    new THREE.RingGeometry(ARRIVAL_NM * NM_M - 200, ARRIVAL_NM * NM_M, 96),
    new THREE.MeshBasicMaterial({ color: 0x4ecdc4, transparent: true, opacity: 0.12, side: THREE.DoubleSide })
  );
  arrRing.rotation.x = -Math.PI / 2;
  arrRing.position.y = 1.5;
  g.add(arrRing);
  return g;
}

function makeGridFallback() {
  const grid = new THREE.GridHelper(GROUND_M, 80, 0x1e3a4a, 0x122030);
  grid.position.y = 0;
  groundGroup.add(grid);
  groundGroup.add(makeRunwaySketch());

  );

  plane.position.y = -1;

  groundReady = true;
}

function latLonToTile(lat, lon, z) {
  const n = 2 ** z;
  const x = Math.floor((lon + 180) / 360 * n);
  const y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);
  return { x, y, z };
}

function tileToLatLon(x, y, z) {
  const n = Math.PI - 2 * Math.PI * y / 2 ** z;
  const lat = 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
  const lon = x / 2 ** z * 360 - 180;
  return { lat, lon };
}

async function loadSatGround() {
  makeGridFallback();
  const z = 11;
  const center = latLonToTile(ORIGIN.lat, ORIGIN.lon, z);
  const span = 2;
  const size = 256 * (span * 2 + 1);
  const cvs = document.createElement('canvas');
  cvs.width = size; cvs.height = size;
  const ctx = cvs.getContext('2d');
  ctx.fillStyle = '#0c1218';
  ctx.fillRect(0, 0, size, size);

  let loaded = 0;
  const total = (span * 2 + 1) ** 2;
  const urls = [];
  for (let dy = -span; dy <= span; dy++) {
    for (let dx = -span; dx <= span; dx++) {
      const tx = center.x + dx;
      const ty = center.y + dy;
      const url = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${ty}/${tx}`;
      urls.push({ url, px: (dx + span) * 256, py: (dy + span) * 256 });
    }
  }

  const tilePromise = Promise.all(urls.map(({ url, px, py }) => new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    const done = () => resolve();
    const t = setTimeout(done, 4000);
    img.onload = () => { clearTimeout(t); ctx.drawImage(img, px, py); loaded++; resolve(); };
    img.onerror = () => { clearTimeout(t); resolve(); };
    img.src = url;
  })));
  await Promise.race([
    tilePromise,
    new Promise((r) => setTimeout(r, 5000)),
  ]);

  if (loaded < total * 0.3) return;

  while (groundGroup.children.length) {
    const ch = groundGroup.children[0];
    groundGroup.remove(ch);
    if (ch.geometry) ch.geometry.dispose?.();
    if (ch.material) {
      if (Array.isArray(ch.material)) ch.material.forEach((m) => m.dispose?.());
      else ch.material.dispose?.();
    }
  }

  const nw = tileToLatLon(center.x - span, center.y - span, z);
  const se = tileToLatLon(center.x + span + 1, center.y + span + 1, z);
  const nwE = enu(nw.lat, nw.lon, 0);
  const seE = enu(se.lat, se.lon, 0);
  const width = Math.abs(seE.x - nwE.x);
  const height = Math.abs(seE.z - nwE.z);
  const cx = (nwE.x + seE.x) / 2;
  const cz = (nwE.z + seE.z) / 2;

  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace;
  try { tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy() || 1); } catch (_) {}
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92, metalness: 0.0 });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height), mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(cx, 0, cz);
  groundGroup.add(mesh);

  const grid = new THREE.GridHelper(Math.max(width, height) * 0.9, 40, 0xffffff, 0xffffff);
  grid.material.transparent = true;
  grid.material.opacity = 0.04;
  grid.position.y = 2;
  groundGroup.add(grid);
  groundGroup.add(makeRunwaySketch());
  groundReady = true;
}

loadSatGround().catch(() => makeGridFallback());

}

function spdKt(rec) {
  if (rec.gsKt != null && !isNaN(rec.gsKt)) return Math.round(rec.gsKt);
  if (rec.vel != null && !isNaN(rec.vel)) return Math.round(rec.vel / KT_MS);
  return null;
}

function updateSelPanel(rec) {
  const bar = $('sel');
  const body = $('uiSelBody');
  const none = $('uiSelNone');
  if (!rec) {
    bar.classList.remove('visible');
    body.style.display = 'none';
    none.style.display = 'block';
    return;
  }
  const altFt = Math.round((rec.altM || 0) / FT_M);
  const kt = spdKt(rec);
  const spd = kt != null ? kt + ' kt' : '—';
  const track = rec.track != null ? Math.round(rec.track) + '°' : '—';
  const typ = rec.type || '—';
  const reg = rec.reg || '—';
  const cat = rec.cat || classifyType(rec.type);
  const dist = rec.dist != null ? rec.dist.toFixed(1) + ' nm' : '—';
  $('selCs').textContent = rec.callsign || rec.icao;
  $('selGrid').innerHTML =
    `<span>hex</span><b>${rec.icao}</b>` +
    `<span>type</span><b>${typ} <span style="color:var(--muted)">(${cat})</span></b>` +
    `<span>reg</span><b>${reg}</b>` +
    `<span>alt</span><b>${altFt.toLocaleString()} ft</b>` +
    `<span>spd</span><b>${spd}</b>` +
    `<span>track</span><b>${track}</b>` +
    `<span>dist</span><b>${dist}</b>` +
    `<span>arr</span><b>${rec.isArrival ? 'yes' : 'no'}</b>` +
    `<span>src</span><b>${rec.source || '—'}</b>`;
  bar.classList.add('visible');
  none.style.display = 'none';
  body.style.display = 'block';
  body.innerHTML = `<div>${rec.callsign || '—'}</div>` +
    `<div style="color:var(--muted)">${rec.icao} · ${typ} · ${reg}</div>` +
    `<div>${altFt} ft · ${spd} · ${track} · ${dist}</div>`;
}

function renderArrivalsList(arrs) {

      `<div><div class="cs">${a.callsign || a.icao}</div>` +
      `<div class="meta">${a.type || '????'} · ${a.cat || ''}</div></div>` +
      `<div class="nums">${altFt.toLocaleString()} ft<br>${kt != null ? kt + ' kt' : '—'} · ${a.dist.toFixed(1)} nm</div>` +
      `</div>`;
  }).join('');
  el.querySelectorAll('.arr-row').forEach((row) => {
    row.addEventListener('click', () => {
      const id = row.getAttribute('data-icao');
      selectedId = id;
      const rec = aircraft.get(id);
      if (rec) {
        updateSelPanel(rec);
        // nudge camera toward aircraft
        controls.target.lerp(rec.display, 0.6);
      }
      renderArrivalsList(lastArrivals);
    });
  });
}

/** Heuristic: arriving into KSFO (permissive toward-airport) */
function isArrival(p) {
  if (p.onGround) return false;
  if (p.dist == null || p.dist > ARRIVAL_NM) return false;
  // vertical: descending, level-ish, or low — not climbing hard
  const vrFpm = p.vr != null ? p.vr / 0.00508 : 0; // m/s → fpm
  const altFt = (p.altM || 0) / FT_M;
  const climbingHard = vrFpm > 1000 && altFt > 4000;
  if (climbingHard) return false;
  // track toward airport (bearing from ac to ORIGIN within ~110° of track)
  if (p.track == null) {
    // no track: still accept if descending/low within 30 nm
    return (vrFpm < -50) || (altFt < 14000 && p.dist < 30);
  }
  const brgToApt = bearingDeg(p.lat, p.lon, ORIGIN.lat, ORIGIN.lon);
  const diff = Math.abs(angDiff(p.track, brgToApt));
  const toward = diff <= 110;
  const descending = vrFpm < -30;
  const low = altFt < 12000;
  if (toward && (descending || low || p.dist < 28)) return true;
  if (toward && vrFpm < 500) return true;
  // close-in permissive: within 15 nm and not climbing hard
  if (p.dist < 15 && vrFpm < 600) return true;
  return false;
}

// ─── Aircraft lifecycle ──────────────────────────────────────────────────────
function createAircraft(icao, typeHint) {
  const group = new THREE.Group();
  group.userData.icao = icao;

  const info = sizeForType(typeHint);
  const model = buildAircraftModel(info.cat);
  // Scale real meters × visibility multiplier
  model.scale.setScalar(SIZE_MULT);
  model.userData.icao = icao;
  // Tag pickable meshes
  model.traverse((ch) => {
    if (ch.isMesh) ch.userData.icao = icao;
  });
  group.add(model);

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0x4ecdc4, transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  const glowSize = Math.max(180, info.span * SIZE_MULT * 1.8);
  glow.scale.set(glowSize, glowSize, 1);
  group.add(glow);

  // vertical stick (altitude-colored)
  const stickGeo = new THREE.BufferGeometry();
  const stickPos = new Float32Array(6);
  const stickCol = new Float32Array(6);
  stickGeo.setAttribute('position', new THREE.BufferAttribute(stickPos, 3));
  stickGeo.setAttribute('color', new THREE.BufferAttribute(stickCol, 3));
  const stick = new THREE.Line(stickGeo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.75,
  }));
  group.add(stick);

  // short velocity vector
  const velGeo = new THREE.BufferGeometry();
  velGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  const velLine = new THREE.Line(velGeo, new THREE.LineBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.7,
  }));
  group.add(velLine);

  // trail
  const trailGeo = new THREE.BufferGeometry();
  const maxPts = 130;
  const trailPos = new Float32Array(maxPts * 3);
  const trailCol = new Float32Array(maxPts * 3);
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
  trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol, 3));
  trailGeo.setDrawRange(0, 0);
  const trail = new THREE.Line(
    trailGeo,
    new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0.95,
      linewidth: 2, depthWrite: false,
    })
  );
  trail.frustumCulled = false;
  scene.add(trail);

  scene.add(group);

  const recProbe = { icao, callsign: '', type: typeHint || null, altM: 0, vel: null, gsKt: null };
  const label = makeLabel(recProbe);

  return {
    icao, group, model, glow, stick, velLine, trail, trailGeo, trailPos, trailCol, label,
    trailPts: [],
    lastTrailSample: 0,
    lat: 0, lon: 0, altM: 0, track: 0, vel: 0, vr: 0, onGround: false, callsign: '',
    type: typeHint || null, reg: null, gsKt: null, cat: info.cat,
    span: info.span, len: info.len, dist: 0, isArrival: false,
    source: '',
    target: new THREE.Vector3(),
    display: new THREE.Vector3(),
    lastPoll: 0,
    alive: true,
  };
}

function ensureModel(rec) {
  const info = sizeForType(rec.type);
  if (rec.cat === info.cat && rec.model) return;
  // rebuild model for new category
  if (rec.model) {
    rec.group.remove(rec.model);
    rec.model.traverse((ch) => {
      if (ch.geometry) ch.geometry.dispose?.();
      if (ch.material) {
        if (Array.isArray(ch.material)) ch.material.forEach((m) => m.dispose?.());
        else ch.material.dispose?.();
      }
    });
  }
  const model = buildAircraftModel(info.cat);
  model.scale.setScalar(SIZE_MULT);
  model.userData.icao = rec.icao;
  model.traverse((ch) => { if (ch.isMesh) ch.userData.icao = rec.icao; });
  rec.group.add(model);
  rec.model = model;
  rec.cat = info.cat;
  rec.span = info.span;
  rec.len = info.len;
  const glowSize = Math.max(180, info.span * SIZE_MULT * 1.8);
  rec.glow.scale.set(glowSize, glowSize, 1);
}

const labelLayer = document.getElementById('acLabels');
const LABEL_MAX_DIST = 95000; // world units (~m): fade/hide beyond this
const _lblProj = new THREE.Vector3();

function makeLabel(rec) {
  const el = document.createElement('div');
  el.className = 'ac-label hidden';
  el.innerHTML = '<div class="cs"></div><div class="meta"></div>';
  labelLayer.appendChild(el);
  return el;
}

function setLabelInfo(rec) {
  const el = rec.label;
  if (!el) return;
  const cs = (rec.callsign && rec.callsign.trim()) || rec.icao || '—';
  const type = (rec.type && String(rec.type).trim()) || '';
  const altFt = Math.round((rec.altM || 0) / FT_M);
  const gs = rec.gsKt != null ? Math.round(rec.gsKt)
    : (rec.vel != null ? Math.round(rec.vel / KT_MS) : null);
  const line2 = [
    type || null,
    Number.isFinite(altFt) ? (altFt + ' ft') : null,
    gs != null ? (gs + ' kt') : null,
  ].filter(Boolean).join(' · ');
  const key = cs + '|' + line2;
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  el.querySelector('.cs').textContent = cs;
  el.querySelector('.meta').textContent = line2;
}

function updateLabelScreen(rec, cam) {
  const el = rec.label;
  if (!el) return;
  // Default: show for all visible filtered aircraft; hide if behind camera / far
  _lblProj.copy(rec.display);
  _lblProj.y += Math.max(180, (rec.span || 30) * SIZE_MULT * 0.55);
  const dist = _lblProj.distanceTo(cam.position);
  _lblProj.project(cam);
  const behind = _lblProj.z > 1;
  const offscreen = Math.abs(_lblProj.x) > 1.15 || Math.abs(_lblProj.y) > 1.2;
  const tooFar = dist > LABEL_MAX_DIST;
  const show = rec.alive && !behind && !offscreen && !tooFar;
  if (!show) {
    el.classList.add('hidden');
    return;
  }
  el.classList.remove('hidden');
  el.classList.toggle('dim', dist > LABEL_MAX_DIST * 0.55);
  const x = (_lblProj.x * 0.5 + 0.5) * innerWidth;
  const y = (-_lblProj.y * 0.5 + 0.5) * innerHeight;
  el.style.transform = 'translate(' + (x) + 'px,' + (y) + 'px) translate(-50%, calc(-100% - 8px))';
  setLabelInfo(rec);
}

function disposeAircraft(rec) {
  scene.remove(rec.group);
  scene.remove(rec.trail);
  if (rec.model) {
    rec.model.traverse((ch) => {
      if (ch.geometry) ch.geometry.dispose?.();
      if (ch.material) {
        if (Array.isArray(ch.material)) ch.material.forEach((m) => m.dispose?.());
        else ch.material.dispose?.();
      }
    });
  }
  rec.glow.material.dispose();
  rec.stick.geometry.dispose();
  rec.stick.material.dispose();
  rec.velLine.geometry.dispose();
  rec.velLine.material.dispose();
  rec.trailGeo.dispose();
  rec.trail.material.dispose();
  if (rec.label && rec.label.parentNode) rec.label.parentNode.removeChild(rec.label);
}

function updateTrail(rec) {
  const pts = rec.trailPts;
  const n = Math.min(pts.length, settings.trailLen);
  if (n < 1) {
    rec.trailGeo.setDrawRange(0, 0);
    return;
  }
  const start = pts.length - n;
  for (let i = 0; i < n; i++) {
    const tp = pts[start + i];
    const o = i * 3;
    let x, y, z;
    // Last vertex always snugs to current aircraft display so the trail
    // never detaches while dead-reckoning between ADS-B polls.
    if (i === n - 1 && rec.display) {
      x = rec.display.x;
      y = rec.display.y;
      z = rec.display.z;
    } else if (tp.lat != null && tp.lon != null) {
      const w = enu(tp.lat, tp.lon, (tp.altM || 0) * settings.altScale);
      x = w.x; y = w.y; z = w.z;
    } else {
      x = tp.x || 0; y = tp.y || 0; z = tp.z || 0;
    }
    rec.trailPos[o] = x;
    rec.trailPos[o + 1] = y;
    rec.trailPos[o + 2] = z;
    const fade = 0.35 + 0.65 * (i / Math.max(1, n - 1));
    const c = altColor(tp.altM);
    rec.trailCol[o] = c.r * fade;
    rec.trailCol[o + 1] = c.g * fade;
    rec.trailCol[o + 2] = c.b * fade;
  }
  rec.trailGeo.attributes.position.needsUpdate = true;
  rec.trailGeo.attributes.color.needsUpdate = true;
  rec.trailGeo.setDrawRange(0, n);
  rec.trailGeo.computeBoundingSphere();
}

function applyPose(rec) {
  const altVis = (rec.altM || 0) * settings.altScale;
  const p = enu(rec.lat, rec.lon, altVis);
  rec.target.set(p.x, p.y, p.z);
  if (rec.display.lengthSq() === 0) rec.display.copy(rec.target);

  const col = altColor(rec.altM || 0);
  tintModel(rec.model, col);
  rec.glow.material.color.copy(col);

  // stick: ground → aircraft, vertex-colored (ground muted, aircraft bright)
  const pos = rec.stick.geometry.attributes.position.array;
  const scol = rec.stick.geometry.attributes.color.array;
  pos[0] = 0; pos[1] = -rec.display.y; pos[2] = 0;
  pos[3] = 0; pos[4] = 0; pos[5] = 0;
  const cLo = altColor(0);
  scol[0] = cLo.r * 0.35; scol[1] = cLo.g * 0.35; scol[2] = cLo.b * 0.35;
  scol[3] = col.r; scol[4] = col.g; scol[5] = col.b;
  rec.stick.geometry.attributes.position.needsUpdate = true;
  rec.stick.geometry.attributes.color.needsUpdate = true;

  // Orient: track (yaw) + slight pitch from vertical rate
  // Local +Z is nose/forward. ENU: +X east, +Y up, +Z south (−north).
  // Heading 0° (north) → nose toward −Z world ⇒ rotation.y = 0 with model +Z?
  // Model nose +Z (south in ENU). Track 0 (north) needs nose → −Z ⇒ yaw = π.
  // rotation.y = π − trackRad  (or equivalently -track with model nose −Z).
  // Using: yaw so +Z local maps toward track direction in XZ.
  // Track deg clockwise from north; north = −Z, east = +X.
  // Forward world = (sin(track), 0, -cos(track))
  if (rec.track != null) {
    const rad = THREE.MathUtils.degToRad(rec.track);
    // Model nose is +Z. ENU: north = −Z, east = +X.
    // Track 0° (north) ⇒ forward (0,0,−1) ⇒ yaw = π.
    rec.model.rotation.order = 'YXZ';
    rec.model.rotation.y = Math.PI - rad;
    let pitch = 0;
    if (rec.vr != null && rec.vel != null && rec.vel > 5) {
      pitch = Math.atan2(rec.vr, rec.vel);
      pitch = Math.max(-0.35, Math.min(0.35, pitch));
    }
    rec.model.rotation.x = pitch;
  }

  // velocity vector (short)
  const vpos = rec.velLine.geometry.attributes.position.array;
  if (settings.showVelVec && rec.track != null && (rec.vel != null && rec.vel > 1)) {
    const rad = THREE.MathUtils.degToRad(rec.track);
    const len = Math.min(2500, Math.max(400, (rec.vel || 0) * 4));
    vpos[0] = 0; vpos[1] = 0; vpos[2] = 0;
    vpos[3] = Math.sin(rad) * len;
    vpos[4] = (rec.vr || 0) * 4;
    vpos[5] = -Math.cos(rad) * len;
    rec.velLine.visible = true;
    rec.velLine.material.color.copy(col);
  } else {
    rec.velLine.visible = false;
  }
  rec.velLine.geometry.attributes.position.needsUpdate = true;

  // HTML labels positioned in animate() via updateLabelScreen
  setLabelInfo(rec);
}

// ─── Polling ─────────────────────────────────────────────────────────────────
let lastPollAt = 0;
let lastSource = '—';
let pollError = null;

async function poll() {
  const url = `/adsb/states?lat=${ORIGIN.lat}&lon=${ORIGIN.lon}&dist=${settings.radiusNm}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    lastSource = data.source || 'unknown';
    pollError = null;
    const nStates = Array.isArray(data.states) ? data.states.length : (data.n_states || 0);
    if (!nStates) {
      showToast('Waiting for ADS-B feed…', 8000);
    }
    ingest(data);
    lastPollAt = performance.now();
    $('srcLine').textContent = 'source: ' + lastSource + (nStates ? ' (' + nStates + ')' : '');
    $('uiSource').textContent = lastSource === 'adsb.lol' ? 'adsb.lol'
      : lastSource === 'adsb.fi' ? 'adsb.fi'
      : lastSource === 'opensky' ? 'OpenSky' : lastSource;
    $('pollLine').textContent = 'poll: ' + new Date().toLocaleTimeString();
  } catch (e) {
    pollError = e.message || String(e);
    showToast('ADS-B poll failed: ' + pollError);
    $('pollLine').textContent = 'poll error';
  }
}

function ingest(data) {
  const states = data.states || [];
  const src = data.source || '';
  const now = performance.now();
  const seen = new Set();

  // Merge ac meta by hex
  const metaByHex = new Map();
  for (const a of (data.ac || [])) {
    if (!a || !a.hex) continue;
    metaByHex.set(String(a.hex).toLowerCase(), a);
  }

  const parsed = [];
  for (const s of states) {
    if (!s || s[5] == null || s[6] == null) continue;
    const icao = (s[0] || '').toLowerCase();
    const callsign = (s[1] || '').trim().toUpperCase();
    const lon = s[5], lat = s[6];
    const baro = s[7];
    const onGround = !!s[8];
    let vel = s[9]; // m/s
    const track = s[10];
    const vr = s[11];
    const geo = s[13];
    const altM = (geo != null && geo > 0) ? geo : (baro != null ? baro : 0);
    const dist = haversineNm(ORIGIN.lat, ORIGIN.lon, lat, lon);
    const meta = metaByHex.get(icao);
    const type = meta && meta.type ? String(meta.type).toUpperCase() : null;
    const reg = meta && meta.reg ? String(meta.reg).toUpperCase() : null;
    let gsKt = null;
    if (meta && meta.gs != null && !isNaN(Number(meta.gs))) gsKt = Number(meta.gs);
    if ((vel == null || isNaN(vel)) && gsKt != null) vel = gsKt * KT_MS;
    if (gsKt == null && vel != null) gsKt = vel / KT_MS;
    const cat = classifyType(type);
    const p = { icao, callsign, lat, lon, altM, onGround, vel, track, vr, dist, source: src, type, reg, gsKt, cat };
    p.isArrival = isArrival(p);
    parsed.push(p);
  }

  const arrivals = parsed.filter((p) => p.isArrival);

  let list = parsed.filter((p) => {
    if (!settings.showGround && p.onGround) return false;
    if (settings.arrivalsOnly && !p.isArrival) return false;
    if (settings.filter) {
      const f = settings.filter;
      if (!(p.callsign.includes(f) || p.icao.toUpperCase().includes(f) || (p.type || '').includes(f))) return false;
    }
    return true;
  });

  if (list.length > MAX_AIRCRAFT) {
    list.sort((a, b) => {
      const aa = a.isArrival ? 0 : 1, ba = b.isArrival ? 0 : 1;
      if (aa !== ba) return aa - ba;
      const ag = a.onGround ? 1 : 0, bg = b.onGround ? 1 : 0;
      if (ag !== bg) return ag - bg;
      return a.dist - b.dist;
    });
    list = list.slice(0, MAX_AIRCRAFT);
  }

  for (const p of list) {
    seen.add(p.icao);
    let rec = aircraft.get(p.icao);
    if (!rec) {
      rec = createAircraft(p.icao, p.type);
      aircraft.set(p.icao, rec);
    }
    const prevLat = rec.lat, prevLon = rec.lon;
    Object.assign(rec, {
      callsign: p.callsign, lat: p.lat, lon: p.lon, altM: p.altM,
      onGround: p.onGround, vel: p.vel, track: p.track, vr: p.vr,
      source: p.source, lastPoll: now, alive: true,
      type: p.type || rec.type, reg: p.reg || rec.reg, gsKt: p.gsKt,
      dist: p.dist, isArrival: p.isArrival, cat: p.cat || rec.cat,
    });
    ensureModel(rec);
    applyPose(rec);

    // Store geographic history (reprojected on update) so alt-scale changes
    // and dead-reckon snugging stay correct.
    if (!rec.trailPts.length || prevLat !== p.lat || prevLon !== p.lon ||
        Math.abs((rec.trailPts[rec.trailPts.length - 1].altM || 0) - p.altM) > 25) {
      rec.trailPts.push({ lat: p.lat, lon: p.lon, altM: p.altM || 0 });
      if (rec.trailPts.length > 130) rec.trailPts.shift();
      rec.lastTrailSample = now;
    }
    updateTrail(rec);
  }

  for (const [id, rec] of aircraft) {
    if (!seen.has(id)) {
      disposeAircraft(rec);
      aircraft.delete(id);
      if (selectedId === id) { selectedId = null; updateSelPanel(null); }
    }
  }

  $('acCount').textContent = String(aircraft.size);
  $('uiCount').textContent = String(aircraft.size);
  $('arrCount').textContent = String(arrivals.length);
  $('uiArrCount').textContent = String(arrivals.length);
  renderArrivalsList(arrivals);
  if (selectedId && aircraft.has(selectedId)) updateSelPanel(aircraft.get(selectedId));
}

// ─── Interpolation / render ──────────────────────────────────────────────────
const clock = new THREE.Clock();
const _raycaster = new THREE.Raycaster();
const _ptr = new THREE.Vector2();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = performance.now();

  for (const rec of aircraft.values()) {
    // dead-reckon using ground speed
    let estLat = rec.lat, estLon = rec.lon, estAlt = rec.altM || 0;
    const spd = rec.vel != null ? rec.vel : (rec.gsKt != null ? rec.gsKt * KT_MS : 0);
    if (spd > 1 && rec.track != null && !rec.onGround) {
      const age = (t - rec.lastPoll) / 1000;
      if (age > 0 && age < POLL_MS / 1000 * 2.5) {
        const distM = spd * age;
        const rad = THREE.MathUtils.degToRad(rec.track);
        const dNorth = distM * Math.cos(rad);
        const dEast = distM * Math.sin(rad);
        const dLat = (dNorth / R_EARTH) * 180 / Math.PI;
        const dLon = (dEast / (R_EARTH * Math.cos(ORIGIN.lat * Math.PI / 180))) * 180 / Math.PI;
        const dAlt = (rec.vr || 0) * age;
        estLat = rec.lat + dLat;
        estLon = rec.lon + dLon;
        estAlt = Math.max(0, (rec.altM || 0) + dAlt);
        const altVis = estAlt * settings.altScale;
        const p = enu(estLat, estLon, altVis);
        rec.target.set(p.x, p.y, p.z);
      }
    }
    rec.display.lerp(rec.target, 1 - Math.exp(-3.5 * dt));
    rec.group.position.copy(rec.display);

    // Sample trail along dead-reckoned path (~every 2.5s or 400m) so trails
    // follow the track between ADS-B polls instead of long straight gaps.
    if (rec.alive && !rec.onGround && spd > 1) {
      const since = t - (rec.lastTrailSample || 0);
      let movedM = 0;
      if (rec.trailPts.length) {
        const last = rec.trailPts[rec.trailPts.length - 1];
        movedM = haversineNm(last.lat, last.lon, estLat, estLon) * NM_M;
      }
      if (since > 2500 || movedM > 400) {
        rec.trailPts.push({ lat: estLat, lon: estLon, altM: estAlt });
        if (rec.trailPts.length > 130) rec.trailPts.shift();
        rec.lastTrailSample = t;
        updateTrail(rec);
      }
    }
    // Snug trail endpoint to aircraft every frame (positions only — avoid GC)
    if (rec.trailPts.length >= 1) {
      const n = Math.min(rec.trailPts.length, settings.trailLen);
      const o = (n - 1) * 3;
      rec.trailPos[o] = rec.display.x;
      rec.trailPos[o + 1] = rec.display.y;
      rec.trailPos[o + 2] = rec.display.z;
      rec.trailGeo.attributes.position.needsUpdate = true;
      // Keep last sample's geo alt in sync for color continuity on next full update
      const last = rec.trailPts[rec.trailPts.length - 1];
      last.altM = estAlt;
    }

    // Stick: local ground→aircraft (group origin); keep bottom on y=0 world
    const pos = rec.stick.geometry.attributes.position.array;
    pos[0] = 0; pos[1] = -rec.display.y; pos[2] = 0;
    pos[3] = 0; pos[4] = 0; pos[5] = 0;
    rec.stick.geometry.attributes.position.needsUpdate = true;
    updateLabelScreen(rec, camera);
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

canvas.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  const rect = canvas.getBoundingClientRect();
  _ptr.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  _ptr.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  _raycaster.setFromCamera(_ptr, camera);
  const meshes = [];
  for (const rec of aircraft.values()) {
    rec.model.traverse((ch) => { if (ch.isMesh) meshes.push(ch); });
  }
  const hits = _raycaster.intersectObjects(meshes, false);
  if (hits.length) {
    const id = hits[0].object.userData.icao;
    selectedId = id;
    const rec = aircraft.get(id);
    updateSelPanel(rec);
    for (const r of aircraft.values()) setLabelInfo(r);
    renderArrivalsList(lastArrivals);
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

poll();
setInterval(poll, POLL_MS);

setInterval(() => {
  if (performance.memory) {
    const mb = (performance.memory.usedJSHeapSize / 1048576).toFixed(0);
    const el = document.getElementById('uiMem');
    if (el) el.textContent = mb + ' MB';
  }
}, 5000);
</script>
</body>
</html>
