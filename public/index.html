/** Score whether private/GA is inbound to KSFO (not Bay satellite fields). */
function scoreInboundGa(p) {
  if (!p || p.onGround) return null;
  if (!(p.isPrivateGa || isPrivateOrGa(p))) return null;
  if (!(p.isKsfo || isKsfoAssociated(p))) return null;
  const altFt = (p.altM || 0) / FT_M;
  if (altFt < 50) return null;
  const field = BAY_FIELDS[0]; // KSFO only
  const distNm = (p.dist != null) ? p.dist : haversineNm(ORIGIN.lat, ORIGIN.lon, p.lat, p.lon);
  if (distNm > 50) return null;

  const gs = (p.gsKt != null && !isNaN(p.gsKt)) ? p.gsKt
    : (p.vel != null ? p.vel / KT_MS : null);
  const vrFpm = p.vr != null ? p.vr / 0.00508 : 0;
  const brg = bearingDeg(p.lat, p.lon, field.lat, field.lon);
  const trackDiff = p.track != null ? Math.abs(angDiff(p.track, brg)) : 60;
  const toward = trackDiff <= 105;
  const descending = vrFpm < -40;
  const low = altFt < 14000;
  const close = distNm < 35;
  const finalHit = p.finalInfo || detectKsfoFinal(p);

  let closingDist = false;
  if (p._distKsfo != null && distNm < p._distKsfo - 0.15) closingDist = true;
  if (p._prevDistKsfo != null && p._prevDistKsfo - distNm > 0.15) closingDist = true;

  const inbound = toward && (descending || low || close || closingDist || !!finalHit);
  const arr = p.isArrival || isArrival(p);
  if (!inbound && !arr && !finalHit) return null;

  const eta = etaToFieldMin(p.lat, p.lon, p.track, gs, field);
  const tca = timeToClosestApproachMin(p.lat, p.lon, p.track, gs, field.lat, field.lon);
  const etaUse = eta != null ? eta : (tca != null ? tca : distNm * 1.2);

  let score = etaUse;
  score += distNm * 0.15;
  if (descending) score *= 0.88;
  if (toward) score *= 0.92;
  if (arr) score *= 0.9;
  if (finalHit) score *= 0.55; // strongly prefer aircraft on KSFO final
  if (!toward && arr) score *= 1.05;

  return {
    icao: p.icao,
    score,
    etaMin: etaUse,
    etaExact: eta,
    tcaMin: tca,
    field,
    distNm,
    toward,
    descending,
    onFinal: !!finalHit,
    finalRwy: finalHit ? finalHit.rwy : null,
    gsKt: gs,
    altFt,
  };
}

function pickCockpitTargets(fromList) {
  const scored = [];
  const src = fromList || [...aircraft.values()];
  for (const p of src) {
    const s = scoreInboundGa(p);
    if (s) scored.push(s);
  }
  scored.sort((a, b) => a.score - b.score);
  inboundCache = scored;

  // Refresh on-final set (prefer tagged recs, fall back to detect)
  const onFinal = [];
  for (const p of src) {
    const info = p.finalInfo || detectKsfoFinal(p);
    if (info) {
      p.finalInfo = info;
      p.isOnFinal = true;
      onFinal.push(p);
    } else if (p.isOnFinal) {
      p.isOnFinal = false;
      p.finalInfo = null;
    }
  }
  onFinal.sort((a, b) => (a.finalInfo?.score ?? 99) - (b.finalInfo?.score ?? 99));
  finalCache = onFinal;

  if (!scored.length) {
    cockpitPrimaryId = null;
  } else {
    // Single chase primary: prefer best on-final, else best inbound
    const finalScored = scored.filter((s) => s.onFinal);
    const nextId = (finalScored[0] || scored[0]).icao;
    if (cockpitPrimaryId !== nextId) resetFollowViewOffsets();
    cockpitPrimaryId = nextId;
  }

  updateDualFinalCameraMode();
}

/** Auto wide Orbit when 2+ on KSFO final; else Follow (unless user overrode). */
function updateDualFinalCameraMode() {
  const nFinal = finalCache.length;
  const now = performance.now();
  const userLocked = now < camUserOverrideUntil;

  if (nFinal >= 2) {
    if (!userLocked) {
      if (settings.cameraMode !== 'orbit') {
        setCameraMode('orbit', { auto: true });
      }
      dualFinalActive = true;
      // Frame immediately so first dual frame isn't overview
      try { frameDualFinalOrbit(finalCache, true); } catch (_) {}
    }
  } else if (dualFinalActive) {
    dualFinalActive = false;
    if (!userLocked && settings.cameraMode === 'orbit') {
      // Drop back to Follow for single / none
      setCameraMode('follow', { auto: true });
    }
  }
}

/**
 * Wide Air Loom Orbit framing both (or all) aircraft on KSFO final.
 * Keeps airport in frame with generous padding — "wide view orbit".
 */
function frameDualFinalOrbit(recs, snap) {
  const list = (recs && recs.length) ? recs : finalCache;
  if (!list.length) return;
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  let minY = Infinity, maxY = -Infinity;
  let n = 0;
  for (const r of list) {
    const p = r.display || r.target;
    if (!p || !Number.isFinite(p.x)) continue;
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
    n++;
  }
  // Always include KSFO origin so finals read relative to the field
  minX = Math.min(minX, -2500); maxX = Math.max(maxX, 2500);
  minZ = Math.min(minZ, -2500); maxZ = Math.max(maxZ, 2500);
  minY = Math.min(minY, 0); maxY = Math.max(maxY, 800);
  if (!n) return;

  const cx = (minX + maxX) * 0.5;
  const cz = (minZ + maxZ) * 0.5;
  const cy = (minY + maxY) * 0.35;
  const spanX = Math.max(4000, maxX - minX);
  const spanZ = Math.max(4000, maxZ - minZ);
  const span = Math.max(spanX, spanZ) * 1.85; // wide padding
  const dist = Math.max(12000, span * 1.25);
  const height = Math.max(6500, (maxY - minY) * 1.8 + span * 0.55);

  const tgt = new THREE.Vector3(cx, Math.max(400, cy), cz);
  // Slow orbital angle (dual-final dedicated motion; OrbitControls autoRotate off while dual)
  const ang = (performance.now() / 1000) * 0.07;
  const desired = new THREE.Vector3(
    cx + Math.sin(ang) * dist,
    height,
    cz + Math.cos(ang) * dist
  );

  if (snap) {
    controls.target.copy(tgt);
    camera.position.copy(desired);
  } else {
    controls.target.lerp(tgt, 0.08);
    camera.position.lerp(desired, 0.06);
  }
  camera.near = 20;
  camera.far = 8e6;
  camera.updateProjectionMatrix();
  controls.update();
}

function cockpitEyeFor(rec, outPos, outLook, lagScale) {
  // Elevated chase: steep enough that sat ground fills the lower frame (no blue void).
  if (!rec || !rec.display ||
      !Number.isFinite(rec.display.x) || !Number.isFinite(rec.display.y) || !Number.isFinite(rec.display.z)) {
    return false;
  }
  const track = (rec.track != null && Number.isFinite(rec.track)) ? rec.track : 0;
  const rad = THREE.MathUtils.degToRad(track);
  // Forward in ENU: east=sin, north=-z ⇒ (sin, 0, -cos)
  _ckFwd.set(Math.sin(rad), 0, -Math.cos(rad));
  if (!_ckFwd.lengthSq()) _ckFwd.set(0, 0, -1);

  const body = Math.max(18, (rec.len || 12) * SIZE_MULT); // visual length (m)
  const lag = lagScale || 1;
  const zoom = THREE.MathUtils.clamp(followZoom || 1, FOLLOW_ZOOM_MIN, FOLLOW_ZOOM_MAX);
  // Closer + higher → ~35–45° look-down so terrain sits under the aircraft
  const back = Math.max(260, body * 5.2) * lag * zoom;
  const up = Math.max(240, body * 5.0) * lag * zoom;
  const side = Math.max(36, body * 0.85) * lag * zoom;
  const lookAhead = Math.max(6, body * 0.12);

  // Lateral offset: fwd × worldUp = (-fwd.z, 0, fwd.x)
  const rx = -_ckFwd.z, rz = _ckFwd.x;

  outLook.copy(rec.display)
    .addScaledVector(_ckFwd, lookAhead)
    .addScaledVector(_ckUp, -Math.max(12, body * 0.22));
  outPos.copy(rec.display)
    .addScaledVector(_ckFwd, -back)
    .addScaledVector(_ckUp, up);
  outPos.x += rx * side;
  outPos.z += rz * side;

  // User drag orbit: rotate eye around look target (yaw about world up, pitch about right)
  if (followYaw || followPitch) {
    const off = outPos.clone().sub(outLook);
    if (off.lengthSq() > 1e-6) {
      off.applyAxisAngle(_ckUp, followYaw || 0);
      const right = new THREE.Vector3().crossVectors(off, _ckUp);
      if (right.lengthSq() < 1e-8) right.set(1, 0, 0);
      else right.normalize();
      const pitch = THREE.MathUtils.clamp(followPitch || 0, -0.85, 0.95);
      off.applyAxisAngle(right, pitch);
      outPos.copy(outLook).add(off);
    }
  }
  // Never aim above the eye (would sky-fill the frame)
  if (outLook.y > outPos.y - 20) outLook.y = outPos.y - 20;
  // Guard: identical eye/look → lookAt NaNs the matrix and freezes the scene
  if (outPos.distanceToSquared(outLook) < 1e-4) {
    outLook.addScaledVector(_ckFwd, 40);
    outLook.y -= 30;
  }
  return Number.isFinite(outPos.x) && Number.isFinite(outLook.x);
}

function camPosFinite(cam) {
  const p = cam.position;
  return Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(p.z);
}

function updateCockpitCameras(dt) {
  const prim = cockpitPrimaryId ? aircraft.get(cockpitPrimaryId) : null;

  if (!prim || !prim.alive) {
    // fallback: any closest airborne GA
    let best = null, bestD = Infinity;
    for (const r of aircraft.values()) {
      if (r.onGround || !r.isPrivateGa || r.isKsfo === false) continue;
      if (!Number.isFinite(r.display?.x) || !Number.isFinite(r.display?.y)) continue;
      if (r.dist < bestD) { bestD = r.dist; best = r; }
    }
    if (!best) {
      _ckSmoothInit = false;
      return false;
    }
    cockpitPrimaryId = best.icao;
    return updateCockpitCameras(dt);
  }

  if (!cockpitEyeFor(prim, _ckPos, _ckLook, 1)) {
    _ckSmoothInit = false;
    return false;
  }
  const alpha = 1 - Math.exp(-3.2 * dt);
  if (!_ckSmoothInit || !Number.isFinite(_ckPosSm.x)) {
    _ckPosSm.copy(_ckPos); _ckLookSm.copy(_ckLook); _ckSmoothInit = true;
  } else {
    _ckPosSm.lerp(_ckPos, alpha);
    _ckLookSm.lerp(_ckLook, alpha);
  }
  if (!Number.isFinite(_ckPosSm.x) || !Number.isFinite(_ckLookSm.x)) {
    _ckSmoothInit = false;
    return false;
  }
  cockpitCam.position.copy(_ckPosSm);
  cockpitCam.up.set(0, 1, 0);
  cockpitCam.lookAt(_ckLookSm);
  if (!camPosFinite(cockpitCam)) {
    _ckSmoothInit = false;
    return false;
  }
  // Keep ultra-HD USGS mosaic under the chase aircraft (z14–z16)
  if (Number.isFinite(prim.lat) && Number.isFinite(prim.lon)) {
    refreshChaseInset(prim.lat, prim.lon);
  }
  return true;
}

function buildIgCardHtml(rec, badge) {

  const altFt = Math.round((rec.altM || 0) / FT_M);
  const kt = spdKt(rec);
  const b = badge || (rec.isOnFinal ? 'FINAL' : 'FOLLOW');
  const rwy = rec.finalRwy || rec.finalInfo?.rwy;

    `<div class="ig-head"><div class="ig-cs">${cs}${rwy ? ' · ' + rwy : ''}</div><div class="ig-badge">${b}</div></div>` +
    `<div class="ig-metrics">` +
      `<div><div class="k">Alt</div><div class="v">${altFt.toLocaleString()} ft</div></div>` +
      `<div><div class="k">GS</div><div class="v">${kt != null ? kt + ' kt' : '—'}</div></div>` +
    `</div>`

}

}

function renderArrivalsList(arrs) {
  lastArrivals = arrs;
  const el = $('arrivalsList');
  if (!arrs.length) {
    el.innerHTML = '<div class="arr-empty">No KSFO private/GA in range</div>';
    return;
  }
  const sorted = arrs.slice().sort((a, b) => a.dist - b.dist);
  el.innerHTML = sorted.map((a) => {
    const kt = spdKt(a);
    const altFt = Math.round((a.altM || 0) / FT_M);
    const sel = selectedId === a.icao ? ' selected' : '';
    const finalTag = a.isOnFinal ? ` · FINAL ${a.finalInfo?.rwy || a.finalRwy || ''}`.trim() : '';
    return `<div class="arr-row${sel}" data-icao="${a.icao}">` +
      `<div><div class="cs">${a.callsign || a.icao}${a.isOnFinal ? ' ✈' : ''}</div>` +
      `<div class="meta">${a.type || '????'} · ${a.cat || ''}${finalTag}</div></div>` +
      `<div class="nums">${altFt.toLocaleString()} ft<br>${kt != null ? kt + ' kt' : '—'} · ${a.dist.toFixed(1)} nm</div>` +
      `</div>`;
  }).join('');
  el.querySelectorAll('.arr-row').forEach((row) => {
    row.addEventListener('click', () => {
      const id = row.getAttribute('data-icao');
      selectedId = id;
      const rec = aircraft.get(id);
      if (rec) {

          cockpitPrimaryId = id;

        }

      renderArrivalsList(lastArrivals);
    });
  });
}

/** Heuristic: arriving into KSFO (permissive toward-airport) */
function isArrival(p) {
  if (p.onGround) return false;
  if (p.dist == null || p.dist > ARRIVAL_NM) return false;
  // vertical: descending, level-ish, or low — not climbing hard
  const vrFpm = p.vr != null ? p.vr / 0.00508 : 0; // m/s → fpm
  const altFt = (p.altM || 0) / FT_M;
  const climbingHard = vrFpm > 1000 && altFt > 4000;
  if (climbingHard) return false;
  // track toward airport (bearing from ac to ORIGIN within ~110° of track)
  if (p.track == null) {
    // no track: still accept if descending/low within 30 nm
    return (vrFpm < -50) || (altFt < 14000 && p.dist < 30);
  }
  const brgToApt = bearingDeg(p.lat, p.lon, ORIGIN.lat, ORIGIN.lon);
  const diff = Math.abs(angDiff(p.track, brgToApt));
  const toward = diff <= 110;
  const descending = vrFpm < -30;
  const low = altFt < 12000;
  if (toward && (descending || low || p.dist < 28)) return true;
  if (toward && vrFpm < 500) return true;
  // close-in permissive: within 15 nm and not climbing hard
  if (p.dist < 15 && vrFpm < 600) return true;
  return false;
}

// ─── Premium altitude trails (thin stable ribbon / tube-like) ─────────────────
const TRAIL_MAX_PTS = 200;
const TRAIL_HALF_W = 1.6;     // meters — refined filament
const TRAIL_HALF_W_LOW = 0.55; // taxi / very low alt
const TRAIL_SAMPLE_MS = 650;  // live stream cadence between ADS-B polls
const TRAIL_SAMPLE_M = 90;    // or when DR tip has moved this far
const _tA = new THREE.Vector3();
const _tB = new THREE.Vector3();
const _tTan = new THREE.Vector3();
const _tSide = new THREE.Vector3();
const _tUp = new THREE.Vector3(0, 1, 0);
const _tXAxis = new THREE.Vector3(1, 0, 0);
const _tPrevSide = new THREE.Vector3(1, 0, 0);

// ─── Aircraft lifecycle ──────────────────────────────────────────────────────
function createAircraft(icao, typeHint) {
  const group = new THREE.Group();
  group.userData.icao = icao;

  const info = sizeForType(typeHint);
  const model = buildAircraftModel(info);
  model.scale.setScalar(SIZE_MULT);
  model.userData.icao = icao;
  model.traverse((ch) => {
    if (ch.isMesh) ch.userData.icao = icao;
  });
  group.add(model);

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xf2e0c0, transparent: true, opacity: 0.48,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  const glowSize = Math.max(140, info.span * SIZE_MULT * 1.6);
  glow.scale.set(glowSize, glowSize, 1);
  group.add(glow);

  // vertical stick (altitude-colored) — default OFF
  const stickGeo = new THREE.BufferGeometry();
  const stickPos = new Float32Array(6);
  const stickCol = new Float32Array(6);
  stickGeo.setAttribute('position', new THREE.BufferAttribute(stickPos, 3));
  stickGeo.setAttribute('color', new THREE.BufferAttribute(stickCol, 3));
  const stick = new THREE.Line(stickGeo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.38,
  }));
  stick.visible = settings.showAltSticks;
  stick.renderOrder = 1;
  group.add(stick);

  const velGeo = new THREE.BufferGeometry();
  velGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  const velLine = new THREE.Line(velGeo, new THREE.LineBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.55,
  }));
  group.add(velLine);

  // Premium thin ribbon trail with vertex colors (altitude rainbow)
  const maxPts = TRAIL_MAX_PTS;
  const trailGeo = new THREE.BufferGeometry();
  const trailPos = new Float32Array(maxPts * 2 * 3);
  const trailCol = new Float32Array(maxPts * 2 * 3);
  const trailIdx = new Uint16Array(Math.max(0, maxPts - 1) * 6);
  for (let i = 0; i < maxPts - 1; i++) {
    const b = i * 6;
    const v = i * 2;
    trailIdx[b] = v; trailIdx[b + 1] = v + 1; trailIdx[b + 2] = v + 2;
    trailIdx[b + 3] = v + 1; trailIdx[b + 4] = v + 3; trailIdx[b + 5] = v + 2;
  }
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
  trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol, 3));
  trailGeo.setIndex(new THREE.BufferAttribute(trailIdx, 1));
  trailGeo.setDrawRange(0, 0);
  const trail = new THREE.Mesh(
    trailGeo,
    new THREE.MeshBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.72,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide,
      blending: THREE.NormalBlending, // restrained bloom (no neon wash)
      polygonOffset: true,
      polygonOffsetFactor: -2,
      polygonOffsetUnits: -2,
    })
  );
  trail.frustumCulled = false;
  trail.renderOrder = 2;
  scene.add(trail);

  scene.add(group);

  const recProbe = { icao, callsign: '', type: typeHint || null, altM: 0, vel: null, gsKt: null };
  const label = makeLabel(recProbe);

  const rec = {
    icao, group, model, glow, stick, velLine, trail, trailGeo, trailPos, trailCol, label,
    trailPts: [],
    lastTrailSample: 0,
    trailSide: new THREE.Vector3(1, 0, 0),
    lat: 0, lon: 0, altM: 0, track: 0, vel: 0, vr: 0, onGround: false, callsign: '',
    type: typeHint || null, reg: null, gsKt: null, squawk: null, cat: info.cat, modelKey: info.key,
    span: info.span, len: info.len, dist: 0, isArrival: false, isPrivateGa: false, isKsfo: false, isOnFinal: false, finalInfo: null, finalRwy: null,
    source: '', _distField: null, _prevDistField: null,
    target: new THREE.Vector3(),
    display: new THREE.Vector3(),
    lastPoll: 0,
    alive: true,
    gltfFamily: null,
    _gltfRequested: null,
  };
  // Procedural first; swap to GLTF when family GLB is ready
  loadIcaoMap().then(() => requestGltfForRec(rec));
  return rec;
}

function ensureModel(rec) {
  const info = sizeForType(rec.type);
  if (rec.modelKey === info.key && rec.model) {
    // Still try GLTF if procedural is showing
    if (!rec.gltfFamily) requestGltfForRec(rec);
    return;
  }
  if (rec.model) {
    rec.group.remove(rec.model);
    rec.model.traverse((ch) => {
      if (ch.geometry) ch.geometry.dispose?.();
      if (ch.material) {
        if (Array.isArray(ch.material)) ch.material.forEach((m) => m.dispose?.());
        else ch.material.dispose?.();
      }
    });
  }
  const model = buildAircraftModel(info);
  model.scale.setScalar(SIZE_MULT);
  model.userData.icao = rec.icao;
  model.traverse((ch) => { if (ch.isMesh) ch.userData.icao = rec.icao; });
  rec.group.add(model);
  rec.model = model;
  rec.cat = info.cat;
  rec.modelKey = info.key;
  rec.span = info.span;
  rec.len = info.len;
  rec.gltfFamily = null;
  rec._gltfRequested = null;
  const glowSize = Math.max(140, info.span * SIZE_MULT * 1.6);
  rec.glow.scale.set(glowSize, glowSize, 1);
  loadIcaoMap().then(() => requestGltfForRec(rec));
}

const labelLayer = document.getElementById('acLabels');
const LABEL_MAX_DIST = 95000;
const _lblProj = new THREE.Vector3();

function makeLabel(rec) {
  const el = document.createElement('div');
  el.className = 'ac-label hidden';
  el.innerHTML = '<div class="cs"></div><div class="meta"></div>';
  labelLayer.appendChild(el);
  return el;
}

function setLabelInfo(rec) {
  const el = rec.label;
  if (!el) return;
  const cs = (rec.callsign && rec.callsign.trim()) || rec.icao || '—';
  const type = (rec.type && String(rec.type).trim()) || '';
  const altFt = Math.round((rec.altM || 0) / FT_M);
  const gs = rec.gsKt != null ? Math.round(rec.gsKt)
    : (rec.vel != null ? Math.round(rec.vel / KT_MS) : null);
  const line2 = [
    type || null,
    Number.isFinite(altFt) ? (altFt + ' ft') : null,
    gs != null ? (gs + ' kt') : null,
  ].filter(Boolean).join(' · ');
  const key = cs + '|' + line2;
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  el.querySelector('.cs').textContent = cs;
  el.querySelector('.meta').textContent = line2;
}

function updateLabelScreen(rec, cam, view) {
  const el = rec.label;
  if (!el) return;
  if (!cam || !camPosFinite(cam) ||
      !Number.isFinite(rec.display?.x) || !Number.isFinite(rec.display?.y) || !Number.isFinite(rec.display?.z)) {
    el.classList.add('hidden');
    return;
  }
  _lblProj.copy(rec.display);
  _lblProj.y += Math.max(120, (rec.span || 30) * SIZE_MULT * 0.45);
  const dist = _lblProj.distanceTo(cam.position);
  if (!Number.isFinite(dist)) {
    el.classList.add('hidden');
    return;
  }
  _lblProj.project(cam);
  if (!Number.isFinite(_lblProj.x) || !Number.isFinite(_lblProj.y) || !Number.isFinite(_lblProj.z)) {
    el.classList.add('hidden');
    return;
  }
  const behind = _lblProj.z > 1;
  const offscreen = Math.abs(_lblProj.x) > 1.15 || Math.abs(_lblProj.y) > 1.2;
  const tooFar = dist > LABEL_MAX_DIST;
  const show = rec.alive && !behind && !offscreen && !tooFar;
  if (!show) {
    el.classList.add('hidden');
    return;
  }
  el.classList.remove('hidden');
  el.classList.toggle('dim', dist > LABEL_MAX_DIST * 0.55);
  // view = {x,y,w,h} in CSS px (y from top). Defaults to full window.
  const vx = view ? view.x : 0;
  const vy = view ? view.y : 0;
  const vw = view ? view.w : innerWidth;
  const vh = view ? view.h : innerHeight;
  const x = vx + (_lblProj.x * 0.5 + 0.5) * vw;
  const y = vy + (-_lblProj.y * 0.5 + 0.5) * vh;
  if (!Number.isFinite(x) || !Number.isFinite(y)) {
    el.classList.add('hidden');
    return;
  }
  el.style.transform = 'translate(' + (x) + 'px,' + (y) + 'px) translate(-50%, calc(-100% - 8px))';
  setLabelInfo(rec);
}

function disposeAircraft(rec) {
  scene.remove(rec.group);
  scene.remove(rec.trail);
  if (rec.model) {
    rec.model.traverse((ch) => {
      if (ch.geometry) ch.geometry.dispose?.();
      if (ch.material) {
        if (Array.isArray(ch.material)) ch.material.forEach((m) => m.dispose?.());
        else ch.material.dispose?.();
      }
    });
  }
  rec.glow.material.dispose();
  rec.stick.geometry.dispose();
  rec.stick.material.dispose();
  rec.velLine.geometry.dispose();
  rec.velLine.material.dispose();
  rec.trailGeo.dispose();
  rec.trail.material.dispose();
  if (rec.label && rec.label.parentNode) rec.label.parentNode.removeChild(rec.label);
}

const _trailCtr = new Float32Array(TRAIL_MAX_PTS * 3);

function fillTrailCenter(rec, tp, i, n, out, o) {
  if (i === n - 1 && rec.display) {
    out[o] = rec.display.x; out[o + 1] = rec.display.y; out[o + 2] = rec.display.z;
    return;
  }
  if (tp.lat != null && tp.lon != null) {
    const w = enu(tp.lat, tp.lon, (tp.altM || 0) * settings.altScale);
    out[o] = w.x; out[o + 1] = w.y; out[o + 2] = w.z;
  } else {
    out[o] = tp.x || 0; out[o + 1] = tp.y || 0; out[o + 2] = tp.z || 0;
  }
}

function trailHalfWidthForAlt(altM, u) {
  // u: 0 = oldest (tip), 1 = aircraft (base)
  const low = Math.max(0, Math.min(1, 1 - (altM || 0) / 180)); // < ~600 ft → squeeze
  const base = TRAIL_HALF_W * (1 - 0.72 * low) + TRAIL_HALF_W_LOW * low;
  // taper toward oldest tip; slightly fuller near aircraft
  return base * (0.22 + 0.78 * u);
}

function updateTrail(rec) {
  const pts = rec.trailPts;
  let n = Math.min(pts.length, settings.trailLen);
  // At very low alt / ground: shorten trail so taxi isn't a glass shard field
  const tipAlt = pts.length ? (pts[pts.length - 1].altM || 0) : 0;
  if (tipAlt < 50 || rec.onGround) {
    n = Math.min(n, Math.max(8, Math.floor(settings.trailLen * 0.35)));
  } else if (tipAlt < 150) {
    n = Math.min(n, Math.max(14, Math.floor(settings.trailLen * 0.55)));
  }
  if (n < 2) {
    rec.trail.visible = false;
    rec.trailGeo.setDrawRange(0, 0);
    return;
  }
  rec.trail.visible = true;

  // Opacity: softer on ground
  const mat = rec.trail.material;
  if (tipAlt < 40 || rec.onGround) mat.opacity = 0.28;
  else if (tipAlt < 120) mat.opacity = 0.48;
  else mat.opacity = 0.68;

  const start = pts.length - n;
  for (let i = 0; i < n; i++) {
    fillTrailCenter(rec, pts[start + i], i, n, _trailCtr, i * 3);
  }

  // Stable side: world-up bias + continuity with previous side (no screen-facing flips)
  let side = rec.trailSide || _tPrevSide;
  for (let i = 0; i < n; i++) {
    const o = i * 3;
    const cx = _trailCtr[o], cy = _trailCtr[o + 1], cz = _trailCtr[o + 2];
    if (i < n - 1) {
      _tTan.set(_trailCtr[o + 3] - cx, _trailCtr[o + 4] - cy, _trailCtr[o + 5] - cz);
    } else {
      _tTan.set(cx - _trailCtr[o - 3], cy - _trailCtr[o - 2], cz - _trailCtr[o - 1]);
    }
    if (_tTan.lengthSq() < 1e-6) _tTan.set(1, 0, 0);
    _tTan.normalize();

    _tSide.crossVectors(_tTan, _tUp);
    if (_tSide.lengthSq() < 1e-6) {
      // nearly vertical — reuse previous horizontal side
      _tSide.copy(side);
      _tSide.y = 0;
      if (_tSide.lengthSq() < 1e-8) _tSide.crossVectors(_tTan, _tXAxis);
    }
    _tSide.normalize();
    // Keep continuity: flip if we'd reverse vs previous
    if (side && _tSide.dot(side) < 0) _tSide.negate();
    side = _tSide.clone();

    const u = i / Math.max(1, n - 1);
    const altM = pts[start + i].altM || 0;
    const halfW = trailHalfWidthForAlt(altM, u);
    const fade = Math.pow(u, 1.05) * (tipAlt < 50 ? 0.55 : 1);
    const c = altColor(altM);
    const cr = c.r * fade, cg = c.g * fade, cb = c.b * fade;
    const lo = i * 6;
    rec.trailPos[lo]     = cx + _tSide.x * halfW;
    rec.trailPos[lo + 1] = cy + _tSide.y * halfW;
    rec.trailPos[lo + 2] = cz + _tSide.z * halfW;
    rec.trailPos[lo + 3] = cx - _tSide.x * halfW;
    rec.trailPos[lo + 4] = cy - _tSide.y * halfW;
    rec.trailPos[lo + 5] = cz - _tSide.z * halfW;
    rec.trailCol[lo] = cr; rec.trailCol[lo + 1] = cg; rec.trailCol[lo + 2] = cb;
    rec.trailCol[lo + 3] = cr; rec.trailCol[lo + 4] = cg; rec.trailCol[lo + 5] = cb;
  }
  if (side) {
    if (!rec.trailSide) rec.trailSide = new THREE.Vector3();
    rec.trailSide.copy(side);
  }
  rec.trailGeo.attributes.position.needsUpdate = true;
  rec.trailGeo.attributes.color.needsUpdate = true;
  rec.trailGeo.setDrawRange(0, (n - 1) * 6);
  rec.trailGeo.computeBoundingSphere();
}

/** Fast per-frame tip attach: move last ribbon ring to aircraft. */
function snugTrailTip(rec) {
  const pts = rec.trailPts;
  let n = Math.min(pts.length, settings.trailLen);
  const tipAlt = pts.length ? (pts[pts.length - 1].altM || 0) : 0;
  if (tipAlt < 50 || rec.onGround) {
    n = Math.min(n, Math.max(8, Math.floor(settings.trailLen * 0.35)));
  } else if (tipAlt < 150) {
    n = Math.min(n, Math.max(14, Math.floor(settings.trailLen * 0.55)));
  }
  if (n < 2 || !rec.display) return;
  const start = pts.length - n;
  const i = n - 1;
  const tpPrev = pts[start + i - 1];
  let px, py, pz;
  if (tpPrev.lat != null && tpPrev.lon != null) {
    const w = enu(tpPrev.lat, tpPrev.lon, (tpPrev.altM || 0) * settings.altScale);
    px = w.x; py = w.y; pz = w.z;
  } else {
    px = tpPrev.x || 0; py = tpPrev.y || 0; pz = tpPrev.z || 0;
  }
  _tTan.set(rec.display.x - px, rec.display.y - py, rec.display.z - pz);
  if (_tTan.lengthSq() < 1e-6) _tTan.set(1, 0, 0);
  _tTan.normalize();
  _tSide.crossVectors(_tTan, _tUp);
  if (_tSide.lengthSq() < 1e-8) {
    if (rec.trailSide) _tSide.copy(rec.trailSide);
    else _tSide.set(1, 0, 0);
  } else {
    _tSide.normalize();
    if (rec.trailSide && _tSide.dot(rec.trailSide) < 0) _tSide.negate();
  }
  const halfW = trailHalfWidthForAlt(rec.altM || tipAlt, 1);
  const lo = i * 6;
  rec.trailPos[lo]     = rec.display.x + _tSide.x * halfW;
  rec.trailPos[lo + 1] = rec.display.y + _tSide.y * halfW;
  rec.trailPos[lo + 2] = rec.display.z + _tSide.z * halfW;
  rec.trailPos[lo + 3] = rec.display.x - _tSide.x * halfW;
  rec.trailPos[lo + 4] = rec.display.y - _tSide.y * halfW;
  rec.trailPos[lo + 5] = rec.display.z - _tSide.z * halfW;
  rec.trailGeo.attributes.position.needsUpdate = true;
}

/** Apply heading/pitch to rec.model so nose follows track; trails stay behind. */
function orientAircraftModel(rec, trackOverride) {
  if (!rec?.model) return;
  const track = trackOverride != null ? trackOverride : rec.track;
  if (track == null || !Number.isFinite(track)) return;
  const rad = THREE.MathUtils.degToRad(track);
  rec.model.rotation.order = 'YXZ';
  // +Z nose → ENU forward (sin, 0, −cos)
  rec.model.rotation.y = Math.PI - rad;
  let pitch = 0;
  if (rec.vr != null && rec.vel != null && rec.vel > 5) {
    pitch = Math.atan2(rec.vr, rec.vel);
    pitch = Math.max(-0.35, Math.min(0.35, pitch));
  }
  rec.model.rotation.x = -pitch; // negate: Three YXZ +X pitches nose down
  rec.model.rotation.z = 0;
}

function applyPose(rec) {
  const altVis = (rec.altM || 0) * settings.altScale;
  const p = enu(rec.lat, rec.lon, altVis);
  rec.target.set(p.x, p.y, p.z);
  if (rec.display.lengthSq() === 0) rec.display.copy(rec.target);

  const col = altColor(rec.altM || 0);
  tintModel(rec.model, col); // fin accent only — body stays aluminum
  // subtle altitude hint on glow sprite (not the whole airframe)
  rec.glow.material.color.copy(col);
  // glow opacity set per-frame from camera distance (Orbit visibility)

  // stick: ground → aircraft (subtle; default hidden)
  rec.stick.visible = !!settings.showAltSticks;
  if (settings.showAltSticks) {
    const pos = rec.stick.geometry.attributes.position.array;
    const scol = rec.stick.geometry.attributes.color.array;
    pos[0] = 0; pos[1] = -rec.display.y; pos[2] = 0;
    pos[3] = 0; pos[4] = 0; pos[5] = 0;
    // Hairline drop — pearl at ground, soft altitude tip
    scol[0] = 0.42; scol[1] = 0.46; scol[2] = 0.55;
    scol[3] = col.r * 0.55; scol[4] = col.g * 0.55; scol[5] = col.b * 0.55;
    rec.stick.geometry.attributes.position.needsUpdate = true;
    rec.stick.geometry.attributes.color.needsUpdate = true;
  }

  // Orient mesh to ground track (true track from ADS-B / OpenSky).
  // Model / procedural nose is +Z. ENU: +X east, +Y up, +Z south (−north).
  // Forward world for track θ° CW from north: (sin θ, 0, −cos θ).
  // With Three Y-up, yaw = π − θ maps local +Z → that forward.
  // Pitch: climb (vr>0) must raise the nose; YXZ +rot.x pitches nose down, so negate.
  orientAircraftModel(rec);

  // velocity vector (short)
  const vpos = rec.velLine.geometry.attributes.position.array;
  if (settings.showVelVec && rec.track != null && (rec.vel != null && rec.vel > 1)) {
    const rad = THREE.MathUtils.degToRad(rec.track);
    const len = Math.min(2500, Math.max(400, (rec.vel || 0) * 4));
    vpos[0] = 0; vpos[1] = 0; vpos[2] = 0;
    vpos[3] = Math.sin(rad) * len;
    vpos[4] = (rec.vr || 0) * 4;
    vpos[5] = -Math.cos(rad) * len;
    rec.velLine.visible = true;
    rec.velLine.material.color.copy(col);
  } else {
    rec.velLine.visible = false;
  }
  rec.velLine.geometry.attributes.position.needsUpdate = true;

  // HTML labels positioned in animate() via updateLabelScreen
  setLabelInfo(rec);
}

// ─── Polling ─────────────────────────────────────────────────────────────────
let lastPollAt = 0;
let lastSource = '—';
let pollError = null;

async function poll() {
  const url = `/adsb/states?lat=${ORIGIN.lat}&lon=${ORIGIN.lon}&dist=${settings.radiusNm}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    lastSource = data.source || 'unknown';
    pollError = null;
    const nStates = Array.isArray(data.states) ? data.states.length : (data.n_states || 0);
    if (!nStates) {
      showToast('Waiting for ADS-B feed…', 8000);
    }
    ingest(data);
    lastPollAt = performance.now();
    $('srcLine').textContent = lastSource + (nStates ? ' · ' + nStates : '');
    $('uiSource').textContent = lastSource === 'adsb.lol' ? 'adsb.lol'
      : lastSource === 'adsb.fi' ? 'adsb.fi'
      : lastSource === 'opensky' ? 'OpenSky' : lastSource;
    $('pollLine').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    pollError = e.message || String(e);
    showToast('ADS-B poll failed: ' + pollError);
    $('pollLine').textContent = 'poll error';
  }
}

function ingest(data) {
  const states = data.states || [];
  const src = data.source || '';
  const now = performance.now();
  const seen = new Set();

  // Merge ac meta by hex
  const metaByHex = new Map();
  for (const a of (data.ac || [])) {
    if (!a || !a.hex) continue;
    metaByHex.set(String(a.hex).toLowerCase(), a);
  }

  const parsed = [];
  for (const s of states) {
    if (!s || s[5] == null || s[6] == null) continue;
    const icao = (s[0] || '').toLowerCase();
    const callsign = (s[1] || '').trim().toUpperCase();
    const lon = s[5], lat = s[6];
    const baro = s[7];
    const onGround = !!s[8];
    let vel = s[9]; // m/s
    const track = s[10];
    const vr = s[11];
    const geo = s[13];
    const squawk = s[14] != null && String(s[14]).trim() ? String(s[14]).trim() : null;
    const altM = (geo != null && geo > 0) ? geo : (baro != null ? baro : 0);
    const dist = haversineNm(ORIGIN.lat, ORIGIN.lon, lat, lon);
    const meta = metaByHex.get(icao);
    const type = meta && meta.type ? String(meta.type).toUpperCase() : null;
    const reg = meta && meta.reg ? String(meta.reg).toUpperCase() : null;
    let gsKt = null;
    if (meta && meta.gs != null && !isNaN(Number(meta.gs))) gsKt = Number(meta.gs);
    if ((vel == null || isNaN(vel)) && gsKt != null) vel = gsKt * KT_MS;
    if (gsKt == null && vel != null) gsKt = vel / KT_MS;
    const cat = classifyType(type);
    const p = { icao, callsign, lat, lon, altM, onGround, vel, track, vr, dist, source: src, type, reg, gsKt, cat, squawk };
    p.isArrival = isArrival(p);
    parsed.push(p);
  }

  const arrivals = parsed.filter((p) => p.isArrival);

  // Tag private/GA + KSFO association / final on every parsed aircraft
  for (const p of parsed) {
    p.isPrivateGa = isPrivateOrGa(p);
    p.finalInfo = detectKsfoFinal(p);
    p.isOnFinal = !!p.finalInfo;
    p.isKsfo = isKsfoAssociated(p);
  }
  const privateGa = parsed.filter((p) => p.isPrivateGa);
  const ksfoGa = parsed.filter((p) => p.isPrivateGa && p.isKsfo);
  const onFinalAll = parsed.filter((p) => p.isOnFinal);

  let list = parsed.filter((p) => {
    if (!settings.showGround && p.onGround) return false;
    if (settings.trafficMode === 'ga') {
      // Default product: ONLY KSFO-associated private/GA (not SQL/HAF/PAO Bay GA)
      if (!p.isPrivateGa || !p.isKsfo) return false;
    }
    if (settings.trafficMode === 'arrivals' && !p.isArrival) return false;
    // Arrivals / all still prefer KSFO association for shown traffic unless filter set
    if (settings.trafficMode === 'arrivals' && !p.isKsfo) return false;
    if (settings.filter) {
      const f = settings.filter;
      if (!(p.callsign.includes(f) || p.icao.toUpperCase().includes(f) || (p.type || '').includes(f))) return false;
    }
    return true;
  });

  if (list.length > MAX_AIRCRAFT) {
    list.sort((a, b) => {
      const fA = a.isOnFinal ? 0 : 1, fB = b.isOnFinal ? 0 : 1;
      if (fA !== fB) return fA - fB;
      const kA = a.isKsfo ? 0 : 1, kB = b.isKsfo ? 0 : 1;
      if (kA !== kB) return kA - kB;
      const agA = a.isPrivateGa ? 0 : 1, agB = b.isPrivateGa ? 0 : 1;
      if (agA !== agB) return agA - agB;
      const aa = a.isArrival ? 0 : 1, ba = b.isArrival ? 0 : 1;
      if (aa !== ba) return aa - ba;
      const ag = a.onGround ? 1 : 0, bg = b.onGround ? 1 : 0;
      if (ag !== bg) return ag - bg;
      return a.dist - b.dist;
    });
    list = list.slice(0, MAX_AIRCRAFT);
  }

  for (const p of list) {
    seen.add(p.icao);
    let rec = aircraft.get(p.icao);
    if (!rec) {
      rec = createAircraft(p.icao, p.type);
      aircraft.set(p.icao, rec);
    }
    const prevLat = rec.lat, prevLon = rec.lon;
    const near = nearestBayField(p.lat, p.lon);
    rec._prevDistField = rec._distField;
    rec._distField = near.distNm;
    rec._prevDistKsfo = rec._distKsfo;
    rec._distKsfo = p.dist;
    p._prevDistField = rec._prevDistField;
    p._distField = near.distNm;
    p._prevDistKsfo = rec._prevDistKsfo;
    p._distKsfo = p.dist;
    Object.assign(rec, {
      callsign: p.callsign, lat: p.lat, lon: p.lon, altM: p.altM,
      onGround: p.onGround, vel: p.vel, track: p.track, vr: p.vr,
      source: p.source, lastPoll: now, alive: true,
      type: p.type || rec.type, reg: p.reg || rec.reg, gsKt: p.gsKt,
      dist: p.dist, isArrival: p.isArrival, isPrivateGa: !!p.isPrivateGa, cat: p.cat || rec.cat,
      squawk: p.squawk || rec.squawk || null,
      nearestField: near.field.short, nearestFieldNm: near.distNm,
      isKsfo: !!p.isKsfo, isOnFinal: !!p.isOnFinal, finalInfo: p.finalInfo || null,
      finalRwy: p.finalInfo ? p.finalInfo.rwy : null,
    });
    // feed closing-distance into score via parsed proxy fields
    p._prevDistField = p._prevDistField;
    ensureModel(rec);
    applyPose(rec);

    // Geographic history: last point is always the live tip (glued to ADS-B / DR).
    // Animate() solidifies samples on cadence so the wake grows between polls.
    if (!rec.trailPts.length) {
      const spd0 = p.vel != null ? p.vel : (p.gsKt != null ? p.gsKt * KT_MS : 0);
      if (p.track != null && Number.isFinite(p.track) && spd0 > 1) {
        const behindM = 120;
        const rad = THREE.MathUtils.degToRad(p.track);
        const dLat = (-behindM * Math.cos(rad) / R_EARTH) * 180 / Math.PI;
        const cosLat = Math.cos(ORIGIN.lat * Math.PI / 180);
        const dLon = (-behindM * Math.sin(rad) / (R_EARTH * cosLat)) * 180 / Math.PI;
        rec.trailPts.push({ lat: p.lat + dLat, lon: p.lon + dLon, altM: p.altM || 0 });
      } else {
        rec.trailPts.push({ lat: p.lat, lon: p.lon, altM: p.altM || 0 });
      }
      rec.trailPts.push({ lat: p.lat, lon: p.lon, altM: p.altM || 0 });
      rec.lastTrailSample = now;
    } else {
      const tip = rec.trailPts[rec.trailPts.length - 1];
      tip.lat = p.lat; tip.lon = p.lon; tip.altM = p.altM || 0;
    }
    updateTrail(rec);
  }

  for (const [id, rec] of aircraft) {
    if (!seen.has(id)) {
      disposeAircraft(rec);
      aircraft.delete(id);
      if (selectedId === id) { selectedId = null; updateSelPanel(null); }
    }
  }

  $('acCount').textContent = String(aircraft.size);
  $('uiCount').textContent = String(aircraft.size);
  const gaShown = [...aircraft.values()].filter((r) => r.isPrivateGa).length;
  const gaTotal = ksfoGa.length; // KSFO-associated private/GA only
  const finalN = [...aircraft.values()].filter((r) => r.isOnFinal).length;
  if ($('gaCount')) $('gaCount').textContent = String(settings.trafficMode === 'ga' ? aircraft.size : gaTotal);
  if ($('uiGaCount')) $('uiGaCount').textContent = String(gaTotal);
  $('uiArrCount').textContent = String(arrivals.filter((a) => a.isKsfo).length);
  if ($('uiFinalCount')) $('uiFinalCount').textContent = String(finalN || onFinalAll.length);
  // List panel: KSFO private/GA in default mode, KSFO arrivals otherwise
  const listForPanel = settings.trafficMode === 'ga'
    ? ksfoGa.slice().sort((a, b) => {
        const fa = a.isOnFinal ? 0 : 1, fb = b.isOnFinal ? 0 : 1;
        if (fa !== fb) return fa - fb;
        return a.dist - b.dist;
      }).slice(0, 40)
    : arrivals.filter((a) => a.isKsfo);
  renderArrivalsList(listForPanel);
  if (selectedId && aircraft.has(selectedId)) updateSelPanel(aircraft.get(selectedId));

  // Follow-target selection from live KSFO private/GA (prefer final / inbound)
  const cockpitPool = [...aircraft.values()].filter((r) =>
    (r.isPrivateGa || settings.trafficMode !== 'ga') && (r.isKsfo || settings.trafficMode === 'all')
  );
  // Attach prev dist onto pool objects for scoring
  for (const r of cockpitPool) {
    r._prevDistField = r._prevDistField;
  }
  pickCockpitTargets(cockpitPool);
  // If selected aircraft is inbound GA, prefer it as the single chase target
  if (selectedId && aircraft.has(selectedId)) {
    const sel = aircraft.get(selectedId);
    if (sel && (sel.isPrivateGa || isPrivateOrGa(sel)) && !sel.onGround) {
      const scored = scoreInboundGa(sel);
      if (scored) cockpitPrimaryId = sel.icao;
    }
  }
  updateInfoPanel();
}

// ─── Interpolation / render ──────────────────────────────────────────────────
const clock = new THREE.Clock();
const _raycaster = new THREE.Raycaster();
const _ptr = new THREE.Vector2();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = performance.now();

  for (const rec of aircraft.values()) {
    // dead-reckon using ground speed
    let estLat = rec.lat, estLon = rec.lon, estAlt = rec.altM || 0;
    const spd = rec.vel != null ? rec.vel : (rec.gsKt != null ? rec.gsKt * KT_MS : 0);
    if (spd > 1 && rec.track != null && Number.isFinite(rec.track) && !rec.onGround) {
      const age = (t - rec.lastPoll) / 1000;
      if (age > 0 && age < POLL_MS / 1000 * 2.5) {
        const distM = spd * age;
        const rad = THREE.MathUtils.degToRad(rec.track);
        const dNorth = distM * Math.cos(rad);
        const dEast = distM * Math.sin(rad);
        const dLat = (dNorth / R_EARTH) * 180 / Math.PI;
        const dLon = (dEast / (R_EARTH * Math.cos(ORIGIN.lat * Math.PI / 180))) * 180 / Math.PI;
        const dAlt = (rec.vr || 0) * age;
        estLat = rec.lat + dLat;
        estLon = rec.lon + dLon;
        estAlt = Math.max(0, (rec.altM || 0) + dAlt);
        if (Number.isFinite(estLat) && Number.isFinite(estLon) && Number.isFinite(estAlt)) {
          const altVis = estAlt * settings.altScale;
          const p = enu(estLat, estLon, altVis);
          if (Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(p.z)) {
            rec.target.set(p.x, p.y, p.z);
          }
        }
      }
    }
    rec.display.lerp(rec.target, 1 - Math.exp(-3.5 * dt));
    if (!Number.isFinite(rec.display.x)) rec.display.copy(rec.target);
    rec.group.position.copy(rec.display);
    // Keep nose aligned with the same track used for dead-reckon (trails stay aft)
    orientAircraftModel(rec);
    // Air Loom LOD: glow dots at Orbit distance; white mesh + glow sphere when close/Follow
    {
      const eye = (settings.cameraMode === 'follow' && camPosFinite(cockpitCam))
        ? cockpitCam.position : camera.position;
      const dist = rec.display.distanceTo(eye);
      const isFollow = settings.cameraMode === 'follow';
      const LOD_MESH_M = 14000; // show airframe inside ~14 km
      const showMesh = isFollow || dist < LOD_MESH_M;
      if (rec.model) rec.model.visible = showMesh;
      if (rec.velLine) rec.velLine.visible = showMesh && settings.showVelVec;
      if (rec.glow) {
        const col = altColor(rec.altM || 0);
        rec.glow.material.color.copy(col);
        if (!showMesh) {
          // Orbit far: soft altitude pearl (not neon billboard)
          const gs = THREE.MathUtils.clamp(160 + dist * 0.014, 200, 2600);
          rec.glow.scale.set(gs, gs, 1);
          rec.glow.material.opacity = THREE.MathUtils.clamp(0.42 + Math.min(dist, 90000) / 200000, 0.42, 0.72);
          rec.glow.visible = true;
        } else {
          // Close / Follow: delicate halo around white mesh
          const base = Math.max(70, (rec.span || 12) * SIZE_MULT * 0.95);
          const boost = isFollow ? base * 0.28 : THREE.MathUtils.clamp(dist * 0.003, 0, 280);
          const gs = Math.max(base * 0.45, boost);
          rec.glow.scale.set(gs, gs, 1);
          rec.glow.material.opacity = isFollow ? 0.22 : 0.34;
          rec.glow.visible = true;
        }
      }
    }

    // Live trail stream: tip tracks dead-reckon every frame; solidify samples
    // on cadence/distance so the wake grows behind the aircraft between polls.
    if (rec.alive && rec.trailPts.length) {
      const tip = rec.trailPts[rec.trailPts.length - 1];
      if (Number.isFinite(estLat) && Number.isFinite(estLon)) {
        tip.lat = estLat;
        tip.lon = estLon;
        tip.altM = estAlt;
      }
      if (!rec.onGround && spd > 1) {
        const since = t - (rec.lastTrailSample || 0);
        let movedM = 0;
        if (rec.trailPts.length >= 2) {
          const prev = rec.trailPts[rec.trailPts.length - 2];
          if (prev && prev.lat != null && Number.isFinite(estLat)) {
            movedM = haversineNm(prev.lat, prev.lon, estLat, estLon) * NM_M;
          }
        }
        if (since > TRAIL_SAMPLE_MS || movedM > TRAIL_SAMPLE_M) {
          // Freeze a copy of the live tip as history; tip stays last and keeps streaming
          rec.trailPts.splice(rec.trailPts.length - 1, 0, {
            lat: tip.lat, lon: tip.lon, altM: tip.altM,
          });
          if (rec.trailPts.length > TRAIL_MAX_PTS) rec.trailPts.shift();
          rec.lastTrailSample = t;
          updateTrail(rec);
        } else if (rec.trailPts.length >= 2) {
          snugTrailTip(rec);
        }
      } else if (rec.trailPts.length >= 2) {
        snugTrailTip(rec);
      }
    } else if (rec.trailPts.length >= 2) {
      snugTrailTip(rec);
    }

    // Stick: local ground→aircraft (group origin); keep bottom on y=0 world
    if (settings.showAltSticks && rec.stick.visible) {
      const pos = rec.stick.geometry.attributes.position.array;
      pos[0] = 0; pos[1] = -rec.display.y; pos[2] = 0;
      pos[3] = 0; pos[4] = 0; pos[5] = 0;
      rec.stick.geometry.attributes.position.needsUpdate = true;
    }
  }

  // Update Follow camera BEFORE labels so projection never uses a stale/NaN eye
  let followOk = false;
  const w = innerWidth, h = innerHeight;
  if (settings.cameraMode === 'follow') {
    followOk = updateCockpitCameras(dt);
  }

  // Labels: orbit cam, or single follow chase cam
  for (const rec of aircraft.values()) {
    if (settings.cameraMode === 'follow') {
      if (!followOk) {
        // No inbound GA — match the orbit fallback render so labels don't explode
        updateLabelScreen(rec, camera);
      } else {
        updateLabelScreen(rec, cockpitCam);
      }
    } else {
      updateLabelScreen(rec, camera);
    }
  }

  if (settings.cameraMode === 'follow') {
    renderer.autoClear = true;
    cockpitCam.aspect = w / h;
    cockpitCam.updateProjectionMatrix();
    renderer.setViewport(0, 0, w, h);
    renderer.setScissorTest(false);
    if (followOk) renderer.render(scene, cockpitCam);
    else {
      controls.update();
      renderer.render(scene, camera);
    }
    // Refresh compact HUD occasionally
    if (!updateInfoPanel._t || performance.now() - updateInfoPanel._t > 400) {
      updateInfoPanel._t = performance.now();
      updateInfoPanel();
    }
  } else {
    // Dual-final wide Orbit: continuously re-frame both aircraft
    if (dualFinalActive && finalCache.length >= 2 && settings.cameraMode === 'orbit') {
      try { frameDualFinalOrbit(finalCache, false); } catch (_) { controls.update(); }
    } else {
      controls.update();
    }
    renderer.autoClear = true;
    renderer.setViewport(0, 0, innerWidth, innerHeight);
    renderer.setScissorTest(false);
    renderer.render(scene, camera);
  }
}
animate();

function activeViewCam() {
  if (settings.cameraMode === 'follow' && camPosFinite(cockpitCam)) return cockpitCam;
  return camera;
}

function pickAircraftAt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  _ptr.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  _ptr.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  _raycaster.setFromCamera(_ptr, activeViewCam());
  const meshes = [];
  for (const rec of aircraft.values()) {
    if (!rec.model) continue;
    rec.model.traverse((ch) => { if (ch.isMesh) meshes.push(ch); });
  }
  const hits = _raycaster.intersectObjects(meshes, false);
  if (!hits.length) return null;
  return aircraft.get(hits[0].object.userData.icao) || null;
}

let _followDrag = null;
let _pinch = { active: false, d0: 0, z0: 1 };

canvas.addEventListener('wheel', (ev) => {
  if (settings.cameraMode !== 'follow') return;
  ev.preventDefault();
  const f = Math.exp(ev.deltaY * 0.00115);
  followZoom = THREE.MathUtils.clamp(followZoom * f, FOLLOW_ZOOM_MIN, FOLLOW_ZOOM_MAX);
}, { passive: false });

canvas.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  if (settings.cameraMode === 'follow') {
    _followDrag = { x: ev.clientX, y: ev.clientY, moved: false, id: ev.pointerId };
    try { canvas.setPointerCapture(ev.pointerId); } catch (_) {}
    return;
  }
  const rec = pickAircraftAt(ev.clientX, ev.clientY);
  if (!rec) return;
  selectedId = rec.icao;
  updateSelPanel(rec);
  for (const r of aircraft.values()) setLabelInfo(r);
  renderArrivalsList(lastArrivals);
  controls.target.lerp(rec.display, 0.7);
});

canvas.addEventListener('pointermove', (ev) => {
  if (!_followDrag || settings.cameraMode !== 'follow') return;
  const dx = ev.clientX - _followDrag.x;
  const dy = ev.clientY - _followDrag.y;
  if (Math.abs(dx) + Math.abs(dy) > 5) _followDrag.moved = true;
  if (_followDrag.moved) {
    followYaw -= dx * 0.005;
    followPitch = THREE.MathUtils.clamp(followPitch - dy * 0.004, -0.85, 0.95);
    _followDrag.x = ev.clientX;
    _followDrag.y = ev.clientY;
  }
});

function endFollowPointer(ev) {
  if (!_followDrag) return;
  const drag = _followDrag;
  _followDrag = null;
  try { canvas.releasePointerCapture(drag.id); } catch (_) {}
  if (drag.moved || settings.cameraMode !== 'follow') return;
  const rec = pickAircraftAt(ev.clientX, ev.clientY);
  if (!rec) return;
  selectedId = rec.icao;
  updateSelPanel(rec);
  for (const r of aircraft.values()) setLabelInfo(r);
  renderArrivalsList(lastArrivals);
  if (!rec.onGround) {
    if (cockpitPrimaryId !== rec.icao) resetFollowViewOffsets();
    cockpitPrimaryId = rec.icao;
    _ckSmoothInit = false;
    updateInfoPanel();
  }
}
canvas.addEventListener('pointerup', endFollowPointer);
canvas.addEventListener('pointercancel', () => { _followDrag = null; });

canvas.addEventListener('dblclick', () => {
  if (settings.cameraMode === 'follow') resetFollowViewOffsets();
});

canvas.addEventListener('touchstart', (e) => {
  if (settings.cameraMode !== 'follow' || e.touches.length !== 2) {
    if (e.touches.length !== 2) _pinch.active = false;
    return;
  }
  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;
  _pinch.active = true;
  _pinch.d0 = Math.hypot(dx, dy) || 1;
  _pinch.z0 = followZoom;
  _followDrag = null; // cancel single-finger orbit while pinching
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  if (!_pinch.active || settings.cameraMode !== 'follow' || e.touches.length !== 2) return;
  e.preventDefault();
  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;
  const d = Math.hypot(dx, dy) || 1;
  followZoom = THREE.MathUtils.clamp(_pinch.z0 * (_pinch.d0 / d), FOLLOW_ZOOM_MIN, FOLLOW_ZOOM_MAX);
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) _pinch.active = false;
}, { passive: true });
canvas.addEventListener('touchcancel', () => { _pinch.active = false; }, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  cockpitCam.aspect = innerWidth / innerHeight;
  cockpitCam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

poll();
setInterval(poll, POLL_MS);

setInterval(() => {
  if (performance.memory) {
    const mb = (performance.memory.usedJSHeapSize / 1048576).toFixed(0);
    const el = document.getElementById('uiMem');
    if (el) el.textContent = mb + ' MB';
  }
}, 5000);
</script>
</body>
</html>
